packages:
  - 'apps/*'
  - 'packages/*'

autoInstallPeers: true
# Dependency lifecycle scripts never run (supply-chain hardening); pnpm 11
# reads this from the workspace file, `.npmrc` is only for auth/registry.
ignoreScripts: true

# Security overrides — each entry is documented in
# scripts/overrides-rationale.json (checked by `pnpm check:overrides`).
overrides:
  '@grpc/grpc-js@<1.14.4': '^1.14.4'
  'esbuild@<0.28.1': '^0.28.1'
  'postcss@<8.5.10': '^8.5.10'
  'js-yaml@<4.2.0': '^4.2.0'
  '@babel/core@<7.29.6': '^7.29.6'
  '@sentry/cli>undici': '6.29.1'
  'glob@>=10.2.0 <10.5.0': '^10.5.0'
  'uuid@<11.1.1': '^11.1.1'
  'postcss-selector-parser@<7.1.6': '^7.1.6'

# Next.js 16.4 loads `.next/server/preview-props.json` unconditionally; the
# OpenNext manifest inliner only globs `*-manifest`, `required-server-files`
# and `prefetch-hints`, so every route 500s in the Worker (issue #422). Same
# class of fix as upstream 1.17.3 (prefetch-hints). Drop once released upstream.
patchedDependencies:
  '@opennextjs/cloudflare@1.20.10': patches/@opennextjs__cloudflare@1.20.10.patch
