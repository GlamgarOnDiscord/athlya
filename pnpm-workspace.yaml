packages:
  - 'apps/*'
  - 'packages/*'

autoInstallPeers: true
# Dependency lifecycle scripts never run (supply-chain hardening); pnpm 11
# reads this from the workspace file, `.npmrc` is only for auth/registry.
ignoreScripts: true

# Security overrides — each entry is documented in
# scripts/overrides-rationale.json (checked by `pnpm check:overrides`).
overrides:
  '@grpc/grpc-js@<1.14.4': '^1.14.4'
  'esbuild@<0.28.1': '^0.28.1'
  'postcss@<8.5.10': '^8.5.10'
  'js-yaml@<4.2.0': '^4.2.0'
  '@babel/core@<7.29.6': '^7.29.6'
  '@sentry/cli>undici': '6.29.1'
