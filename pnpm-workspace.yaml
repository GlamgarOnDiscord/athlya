packages:
  - 'apps/*'
  - 'packages/*'

# Security overrides — duplicate of package.json#pnpm.overrides for pnpm 11+
# compatibility (pnpm 11 reads from this file; pnpm 9 reads from package.json).
# Both locations are kept in sync until pnpm 9 support is retired (issue #511).
overrides:
  dockerode>uuid: '11.1.1'
  testcontainers>tmp: '^0.2.6'
  '@grpc/grpc-js': '>=1.14.4'
  esbuild: '>=0.28.1'
  postcss: '>=8.5.10'
  js-yaml: '>=4.2.0'
  '@babel/core': '>=7.29.6'
  '@sentry/cli>undici': '6.27.0'
  testcontainers>undici: '^7'
  jsdom>ws: '^8.21.0'
