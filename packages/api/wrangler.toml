# ============================================================================
# Staging environment
# ============================================================================
# Pre-production target. Route requires `staging.api.athlya.app` to be
# provisioned as a CNAME in the `athlya.app` Cloudflare zone — deploys
# fail with `code 10043` otherwise.
#
# Secrets are set via:
#   wrangler secret put REDIS_TOKEN    --env staging
#   wrangler secret put DB_URL         --env staging
#   wrangler secret put DB_URL_EU             --env staging   # optional — Neon EU read replica (CN.8.3)
#   wrangler secret put CHAOS_NEON_FAILURE_RATE --env staging # optional — chaos float [0,1] for circuit-breaker testing (CN.6.4); NEVER set in production
#   wrangler secret put JWT_JWKS_URL   --env staging
#   wrangler secret put SENTRY_DSN     --env staging   # optional
# and NEVER land in this file.
[env.staging]
name = "athlya-api-staging"
route = { pattern = "staging.api.athlya.app/*", zone_name = "athlya.app" }
# workers.dev fallback — until staging.api.athlya.app DNS is provisioned
# (no custom domain owned yet), this is the only reachable URL:
# https://athlya-api-staging.<account>.workers.dev
workers_dev = true

[env.staging.vars]
ENVIRONMENT = "staging"
VERSION = "0.0.0-staging"
OTEL_SAMPLE_RATE = "0.5"
# Matches the staging route above (RGPD export download links, #498).
API_PUBLIC_URL = "https://staging.api.athlya.app"

[env.staging.placement]
# Smart placement co-locates the Worker with EU-resident data stores.
# See the module header for the caveat about hard EU region pinning.
mode = "smart"

[[env.staging.queues.producers]]
binding = "EVENTS_QUEUE"
queue = "athlya-events-staging"

[[env.staging.queues.producers]]
binding = "EVENTS_DLQ"
queue = "athlya-events-staging-dlq"

[[env.staging.queues.consumers]]
queue = "athlya-events-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
