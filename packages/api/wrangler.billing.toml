# ----------------------------------------------------------------------------
# athlya-api-billing — Billing bulkhead Worker (issue #230, CN.6.3)
#
# Routes:
#   staging:    staging.api.athlya.app/v1/billing/*
#               staging.api.athlya.app/admin/*
#               staging.api.athlya.app/v1/audit/*
#   production: api.athlya.app/v1/billing/*
#               api.athlya.app/admin/*
#               api.athlya.app/v1/audit/*
#
# Stripe webhook storms on POST /v1/billing/webhook saturate this
# Worker's isolate only; auth and reservation latency are unaffected.
#
# Secrets (set once per env via `wrangler secret put --config wrangler.billing.toml`):
#   DB_URL, REDIS_URL, REDIS_TOKEN, JWT_JWKS_URL, CORS_ORIGIN, JWT_KID,
#   JWT_PRIVATE_KEY_PEM, JWT_PUBLIC_KEY_PEM, JWKS_JSON (admin JWT rotation),
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_PRICE_ID_PRO,
#   BILLING_REDIRECT_URL, BILLING_DB_URL (athlya_billing — the only role
#   allowed to apply Stripe events, migration 0036)
# Production also: SENTRY_DSN, OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_EXPORTER_OTLP_HEADERS,
#   CF_ACCESS_AUD, CF_ACCESS_CERTS_URL (/admin/* is served here).
# scripts/verify-secrets.mjs checks these lists (keep both in sync).
# Queue bindings: OUTBOX_KICK_QUEUE (producer only, issue #311).
#   scripts/verify-secrets.mjs checks that every bound queue exists.
# Observability secrets use the same values as the gateway. Optional, same
#   values as the gateway: JWT_ISSUER, JWT_AUDIENCE. This Worker inherits
#   no secret from the gateway (wrangler.toml).
# ----------------------------------------------------------------------------

name = "athlya-api-billing"
main = "src/workers/billing.ts"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

[observability]
enabled = true
head_sampling_rate = 1.0

[vars]
ENVIRONMENT = "dev"
VERSION = "0.0.0-dev"

# Outbox kick producer (issue #311). This Worker commits outbox rows; after
# such a request it sends one `outbox.kick` so the gateway (athlya-api,
# which owns the consumer) drains them without waiting for the cron. See
# the "Outbox kick queue" block of wrangler.toml. Named envs do not inherit
# queue bindings, so each env declares it.

[[queues.producers]]
binding = "OUTBOX_KICK_QUEUE"
queue = "athlya-outbox-kick"

# ============================================================================
# Staging
# ============================================================================

[env.staging.observability]
enabled = true
head_sampling_rate = 0.5

[env.staging]
name = "athlya-api-billing-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
VERSION = "0.0.0-staging"
OTEL_SAMPLE_RATE = "0.5"

[[env.staging.queues.producers]]
binding = "OUTBOX_KICK_QUEUE"
queue = "athlya-outbox-kick-staging"

[env.staging.placement]
mode = "smart"

[[env.staging.routes]]
pattern = "staging.api.athlya.app/v1/billing/*"
zone_name = "athlya.app"

[[env.staging.routes]]
pattern = "staging.api.athlya.app/admin/*"
zone_name = "athlya.app"

[[env.staging.routes]]
pattern = "staging.api.athlya.app/v1/audit/*"
zone_name = "athlya.app"

# ============================================================================
# Production
# ============================================================================

[env.production.observability]
enabled = true
head_sampling_rate = 0.1

[env.production]
name = "athlya-api-billing-production"

[env.production.vars]
ENVIRONMENT = "production"
VERSION = "0.1.0"
OTEL_SAMPLE_RATE = "0.1"

[[env.production.queues.producers]]
binding = "OUTBOX_KICK_QUEUE"
queue = "athlya-outbox-kick"

[env.production.placement]
mode = "smart"

[[env.production.routes]]
pattern = "api.athlya.app/v1/billing/*"
zone_name = "athlya.app"

[[env.production.routes]]
pattern = "api.athlya.app/admin/*"
zone_name = "athlya.app"

[[env.production.routes]]
pattern = "api.athlya.app/v1/audit/*"
zone_name = "athlya.app"

# ============================================================================
# Preview (per-PR, deployed by preview.yml with --name override)
# ============================================================================

[env.preview]
name = "athlya-api-billing-preview"

[env.preview.vars]
ENVIRONMENT = "preview"
VERSION = "0.0.0-preview"
