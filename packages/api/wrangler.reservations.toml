# ----------------------------------------------------------------------------
# athlya-api-reservations — Reservations bulkhead Worker (issue #230, CN.6.3)
#
# Routes:
#   staging:    staging.api.athlya.app/v1/classes/*
#               staging.api.athlya.app/v1/reservations/*
#               staging.api.athlya.app/v1/members/*
#               staging.api.athlya.app/v1/studios/*
#               staging.api.athlya.app/v1/programs/*
#   production: api.athlya.app/v1/classes/*
#               api.athlya.app/v1/reservations/*
#               api.athlya.app/v1/members/*
#               api.athlya.app/v1/studios/*
#               api.athlya.app/v1/programs/*
#
# Durable Objects:
#   ClassCapacityDO — real-time class capacity via WebSocket.
#   The DO is defined and owned by this Worker (src/workers/reservations.ts
#   exports it). The [[migrations]] tag v1 is intentionally scoped here;
#   the main athlya-api Worker no longer owns this namespace.
#
# Secrets (set once per env via `wrangler secret put --config wrangler.reservations.toml`):
#   DB_URL, REDIS_URL, REDIS_TOKEN, JWT_JWKS_URL, CORS_ORIGIN, JWT_KID,
#   JWT_PRIVATE_KEY_PEM, JWT_PUBLIC_KEY_PEM, JWKS_JSON, EXPORT_URL_SIGNING_KEY
# Production also: SENTRY_DSN, OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_EXPORTER_OTLP_HEADERS.
# Bindings (not secrets): HYPERDRIVE, AVATARS_BUCKET, EXPORTS_BUCKET.
# scripts/verify-secrets.mjs checks this list (keep both in sync).
# Queue bindings: OUTBOX_KICK_QUEUE (producer only, issue #311).
#   scripts/verify-secrets.mjs checks that every bound queue exists.
# ----------------------------------------------------------------------------

name = "athlya-api-reservations"
main = "src/workers/reservations.ts"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

[observability]
enabled = true
head_sampling_rate = 1.0

[vars]
ENVIRONMENT = "dev"
VERSION = "0.0.0-dev"

[[durable_objects.bindings]]
name = "CLASS_CAPACITY_DO"
class_name = "ClassCapacityDO"

[[migrations]]
tag = "v1"
new_classes = ["ClassCapacityDO"]

# Outbox kick producer (issue #311). This Worker commits outbox rows; after
# such a request it sends one `outbox.kick` so the gateway (athlya-api,
# which owns the consumer) drains them without waiting for the cron. See
# the "Outbox kick queue" block of wrangler.toml. Named envs do not inherit
# queue bindings, so each env declares it.

[[queues.producers]]
binding = "OUTBOX_KICK_QUEUE"
queue = "athlya-outbox-kick"

# R2 buckets (issue #625). /v1/members/* reads AVATARS_BUCKET (avatar upload
# and download) and EXPORTS_BUCKET (RGPD export download). Same buckets as
# the gateway's "R2 buckets" block of wrangler.toml, which provisions them.
# Named envs do not inherit bindings, so each env declares them.
# Avatar upload also needs AVATARS_PUBLIC_URL. The gateway does not set it
# yet (uploads answer 503 avatar_upload_not_configured on both Workers); set
# it here in the same envs and with the same value when the gateway does.
# worker-routing.test.ts fails if the two configs differ.

[[r2_buckets]]
binding = "AVATARS_BUCKET"
bucket_name = "athlya-avatars-dev"

[[r2_buckets]]
binding = "EXPORTS_BUCKET"
bucket_name = "athlya-exports-dev"

# ============================================================================
# Staging
# ============================================================================

[env.staging.observability]
enabled = true
head_sampling_rate = 0.5

[env.staging]
name = "athlya-api-reservations-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
VERSION = "0.0.0-staging"
OTEL_SAMPLE_RATE = "0.5"

[[env.staging.queues.producers]]
binding = "OUTBOX_KICK_QUEUE"
queue = "athlya-outbox-kick-staging"

[env.staging.placement]
mode = "smart"

[[env.staging.durable_objects.bindings]]
name = "CLASS_CAPACITY_DO"
class_name = "ClassCapacityDO"

[[env.staging.routes]]
pattern = "staging.api.athlya.app/v1/classes/*"
zone_name = "athlya.app"

[[env.staging.routes]]
pattern = "staging.api.athlya.app/v1/reservations/*"
zone_name = "athlya.app"

[[env.staging.routes]]
pattern = "staging.api.athlya.app/v1/members/*"
zone_name = "athlya.app"

[[env.staging.routes]]
pattern = "staging.api.athlya.app/v1/studios/*"
zone_name = "athlya.app"

[[env.staging.routes]]
pattern = "staging.api.athlya.app/v1/programs/*"
zone_name = "athlya.app"

[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "49e3db37042d4f2999b0c0061363929c"

[[env.staging.r2_buckets]]
binding = "AVATARS_BUCKET"
bucket_name = "athlya-avatars-staging"

[[env.staging.r2_buckets]]
binding = "EXPORTS_BUCKET"
bucket_name = "athlya-exports-staging"

# ============================================================================
# Production
# ============================================================================

[env.production.observability]
enabled = true
head_sampling_rate = 0.1

[env.production]
name = "athlya-api-reservations-production"

[env.production.vars]
ENVIRONMENT = "production"
VERSION = "0.1.0"
OTEL_SAMPLE_RATE = "0.1"

[[env.production.queues.producers]]
binding = "OUTBOX_KICK_QUEUE"
queue = "athlya-outbox-kick"

[env.production.placement]
mode = "smart"

[[env.production.durable_objects.bindings]]
name = "CLASS_CAPACITY_DO"
class_name = "ClassCapacityDO"

[[env.production.routes]]
pattern = "api.athlya.app/v1/classes/*"
zone_name = "athlya.app"

[[env.production.routes]]
pattern = "api.athlya.app/v1/reservations/*"
zone_name = "athlya.app"

[[env.production.routes]]
pattern = "api.athlya.app/v1/members/*"
zone_name = "athlya.app"

[[env.production.routes]]
pattern = "api.athlya.app/v1/studios/*"
zone_name = "athlya.app"

[[env.production.routes]]
pattern = "api.athlya.app/v1/programs/*"
zone_name = "athlya.app"

[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "4cdf25a926de4c84a810dc25fd19135d"

[[env.production.r2_buckets]]
binding = "AVATARS_BUCKET"
bucket_name = "athlya-avatars-production"

[[env.production.r2_buckets]]
binding = "EXPORTS_BUCKET"
bucket_name = "athlya-exports-production"

# ============================================================================
# Preview (per-PR, deployed by preview.yml with --name override)
# ============================================================================

[env.preview]
name = "athlya-api-reservations-preview"

[env.preview.vars]
ENVIRONMENT = "preview"
VERSION = "0.0.0-preview"

[[env.preview.durable_objects.bindings]]
name = "CLASS_CAPACITY_DO"
class_name = "ClassCapacityDO"

# Shared by every preview, like the gateway's preview buckets (not renamed
# per PR by .github/workflows/preview.yml).

[[env.preview.r2_buckets]]
binding = "AVATARS_BUCKET"
bucket_name = "athlya-avatars-preview"

[[env.preview.r2_buckets]]
binding = "EXPORTS_BUCKET"
bucket_name = "athlya-exports-preview"
