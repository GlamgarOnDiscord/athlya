version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    versioning-strategy: increase
    # pnpm 11 rejects packages published < 24h ago (minimumReleaseAge), so
    # a fresher bump would only produce a red `--frozen-lockfile` install.
    cooldown:
      default-days: 1
    labels:
      - dependencies
      - npm
    ignore:
      # Pinned to the exact version patched in pnpm-workspace.yaml
      # (patchedDependencies, patches/@opennextjs__cloudflare@1.20.10.patch):
      # any bump leaves the patch unused, pnpm fails and the whole grouped
      # PR is blocked. Remove once upstream ships the preview-props fix.
      - dependency-name: '@opennextjs/cloudflare'
    # Group minor/patch bumps into one PR each so we get 1-2 PRs/week instead
    # of ~10. Majors stay ungrouped (one PR each) for manual review — they
    # break things (e.g. ESLint 10 vs eslint-plugin-import). See CONTRIBUTING.
    groups:
      dev-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - '*'
        # Minor/patch only — keep action majors as individual PRs (they break
        # things too) so they don't block the minor/patch auto-merge flow.
        update-types:
          - minor
          - patch
