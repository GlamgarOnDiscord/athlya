name: OWASP ZAP Active Scan

# =====================================================================
# Issue #340 — weekly active scan against a dedicated scanning env.
#
# IMPORTANT — this job sends real attack payloads (SQLi, XSS, path
# traversal, etc.). NEVER point it at a shared staging environment
# that serves real or production-adjacent data. Set
# ZAP_ACTIVE_TARGET_URL only after provisioning a throwaway scanning
# env seeded with synthetic data.
#
# How it differs from zap-baseline.yml
# -------------------------------------
# zap-baseline.yml  — passive; spiders the site, reads responses,
#                     no attack payloads; safe on shared staging.
# zap-active.yml    — active; replays and mutates requests with
#                     attack strings; dedicated env only.
#
# Gating
# -------
# Scheduled and manual runs are always trusted, so a missing
# ZAP_ACTIVE_TARGET_URL FAILS the job instead of reporting a green run
# that scanned nothing (issue #340).
#
# Finding lifecycle
# -----------------
# allow_issue_writing: true creates a GitHub issue for each new
# HIGH/MEDIUM finding. Close or label issues as they are triaged.
# WARN-level findings are captured in the uploaded report but do not
# open issues (noise). The job does NOT fail the branch build.
# =====================================================================

on:
  schedule:
    # Every Monday at 02:00 UTC — low-traffic window.
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Optional override for vars.ZAP_ACTIVE_TARGET_URL (full https URL)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  zap-active:
    name: ZAP active scan (scheduled)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve target URL and guard on empty configuration
        id: guard
        env:
          VAR_TARGET: ${{ vars.ZAP_ACTIVE_TARGET_URL }}
          INPUT_TARGET: ${{ github.event.inputs.target_url }}
        run: |
          set -euo pipefail
          TARGET="${INPUT_TARGET:-$VAR_TARGET}"

          if [ -z "$TARGET" ]; then
            echo "::error title=ZAP active scan not configured::vars.ZAP_ACTIVE_TARGET_URL is empty, so no active scan ran. Provision the dedicated synthetic-data scanning environment and set the variable (docs/operations/zap-activation.md)."
            echo "### ZAP active scan: FAILED — no target configured (vars.ZAP_ACTIVE_TARGET_URL)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "ZAP active scan target: $TARGET"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Run ZAP active scan
        if: steps.guard.outputs.skipped == 'false'
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          target: ${{ steps.guard.outputs.target }}
          rules_file_name: '.zap/rules.tsv'
          # Issue writing ON: each HIGH/MEDIUM finding becomes a GitHub
          # issue automatically. WARN-level findings appear only in the
          # uploaded report to keep issue noise manageable.
          allow_issue_writing: true
          # Do not fail the workflow — active scan findings should be
          # triaged as issues, not treated as a hard gate. This mirrors
          # the intent of issue #340: track, not block.
          fail_action: false

      - name: Upload ZAP active scan report
        if: always() && steps.guard.outputs.skipped == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zap-active-report-${{ github.run_id }}
          path: |
            report_html.html
            report_json.json
          retention-days: 90
          if-no-files-found: warn
