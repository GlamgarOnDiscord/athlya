name: Build check

# Validates that Next.js apps and Cloudflare Worker bundles compile
# successfully. Runs on PRs that touch app sources or the API package.
#
# This is a non-required check (not listed in branch protection rules)
# but it surfaces build breakage before merge rather than at deploy time.
# Wrangler validates bundle size, edge-runtime compatibility, and
# import resolution in a way that `tsc` alone cannot.

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/api/**'
      - 'packages/shared/**'
      - 'packages/auth/**'
      - 'packages/billing/**'
      - 'packages/reservations/**'
      - 'packages/programs/**'
      - 'packages/notifications/**'
      - 'packages/members/**'
      - 'packages/db/**'
      - 'packages/ratelimit/**'
      - 'packages/studio/**'
      - '.github/workflows/build-check.yml'
  push:
    branches:
      - master
    paths:
      - 'apps/**'
      - 'packages/api/**'
      - '.github/workflows/build-check.yml'

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Production build (Next.js + Workers)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages and apps
        # `turbo run build` builds packages in dependency order before apps.
        # Next.js production builds for web + studio, Wrangler bundle for API.
        # SKIP_ENV_VALIDATION=1 prevents Next.js from crashing when runtime
        # secrets (RESEND_API_KEY, etc.) are absent in CI.
        env:
          SKIP_ENV_VALIDATION: '1'
          # Wrangler dry-run: upload=false ensures no actual deploy, only bundle.
          WRANGLER_SEND_METRICS: 'false'
        run: pnpm build

      - name: Validate Worker bundle sizes
        # Cloudflare limits: 10 MB compressed per Worker script. Fail loudly
        # if wrangler's build output exceeds the threshold so the engineer
        # can investigate before hitting the platform limit at deploy time.
        run: |
          set -euo pipefail
          MAX_KB=8192
          shopt -s nullglob
          dists=(packages/api/.wrangler/dist/*.js)
          if [ "${#dists[@]}" -eq 0 ]; then
            echo "No Worker bundles found (wrangler build may use a different output path)"
          else
            for dist in "${dists[@]}"; do
              size_kb=$(du -k "$dist" | cut -f1)
              echo "$(basename "$dist"): ${size_kb}KB"
              if [ "$size_kb" -gt "$MAX_KB" ]; then
                echo "ERROR: $(basename "$dist") exceeds ${MAX_KB}KB Worker bundle budget"
                exit 1
              fi
            done
          fi
