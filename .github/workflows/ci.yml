name: CI

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - master
      - 'release/*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Turborepo remote cache — optional.
    # On forks / first-time contributor PRs, TURBO_TOKEN will be empty and Turbo
    # silently falls back to the local filesystem cache. No hard failure.
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Full history helps Turborepo compute accurate task hashes and
          # benefits the optional remote cache.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier (format check)
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Guard — no tracked ignored files or large binaries
        run: |
          # Fail if any file tracked by git is also matched by .gitignore.
          bad=$(git ls-files | git check-ignore --stdin 2>/dev/null || true)
          if [ -n "$bad" ]; then
            echo "ERROR: tracked files matched by .gitignore:"
            echo "$bad"
            exit 1
          fi
          # Fail if any tracked non-text file exceeds 500 KiB.
          large=$(git ls-files | xargs -I{} sh -c \
            'size=$(git cat-file -s "HEAD:{}" 2>/dev/null || echo 0); [ "$size" -gt 512000 ] && echo "{} ($size bytes)"' \
            2>/dev/null || true)
          if [ -n "$large" ]; then
            echo "ERROR: tracked files exceed 500 KiB (add to .gitignore or use Git LFS):"
            echo "$large"
            exit 1
          fi

      - name: Guard — no raw AthlyaDbHttp usage outside withTenantHttp
        run: |
          # Flag adapter files that make direct db.select/insert/update/execute calls
          # on an AthlyaDbHttp handle without going through withTenantHttp.
          # Files that intentionally bypass RLS (e.g. pre-auth flows, non-tenant tables)
          # must carry a // neon-http-norls: <reason> comment to be allowlisted.
          offenders=$(
            grep -rl 'AthlyaDbHttp' packages/api/src/adapters/ \
            | xargs grep -l 'db\.\(select\|insert\|update\|execute\)(' \
            | xargs grep -L 'withTenantHttp\|neon-http-norls' 2>/dev/null || true
          )
          if [ -n "$offenders" ]; then
            echo "ERROR: adapter files use AthlyaDbHttp without withTenantHttp or neon-http-norls allowlist:"
            echo "$offenders"
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & property tests
        # Fast path: unit tests + PGlite-backed properties. Docker-backed PBT
        # (P4/P7/reservations properties) runs in integration-docker.yml.
        run: pnpm test

      - name: Production build (Next.js + Workers)
        # Validates that Next.js apps and Cloudflare Worker bundles compile.
        # SKIP_ENV_VALIDATION prevents Next.js from crashing when runtime
        # secrets are absent in CI. cross-env ensures Windows/Linux portability.
        env:
          SKIP_ENV_VALIDATION: '1'
          WRANGLER_SEND_METRICS: 'false'
        run: pnpm build

  label-hygiene:
    name: Label hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Check labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-labels.mjs

  docs-drift:
    name: Documentation drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Check documentation drift
        run: node scripts/check-docs-drift.mjs
