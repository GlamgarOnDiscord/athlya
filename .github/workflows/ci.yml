name: CI

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - master
      - 'release/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Turborepo remote cache — optional.
    # On forks / first-time contributor PRs, TURBO_TOKEN will be empty and Turbo
    # silently falls back to the local filesystem cache. No hard failure.
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history helps Turborepo compute accurate task hashes and
          # benefits the optional remote cache.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier (format check)
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Guard — no raw AthlyaDbHttp usage outside withTenantHttp
        run: |
          # Flag adapter files that make direct db.select/insert/update/execute calls
          # on an AthlyaDbHttp handle without going through withTenantHttp.
          # Files that intentionally bypass RLS (e.g. pre-auth flows, non-tenant tables)
          # must carry a // neon-http-norls: <reason> comment to be allowlisted.
          offenders=$(
            grep -rl 'AthlyaDbHttp' packages/api/src/adapters/ \
            | xargs grep -l 'db\.\(select\|insert\|update\|execute\)(' \
            | xargs grep -L 'withTenantHttp\|neon-http-norls' 2>/dev/null || true
          )
          if [ -n "$offenders" ]; then
            echo "ERROR: adapter files use AthlyaDbHttp without withTenantHttp or neon-http-norls allowlist:"
            echo "$offenders"
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & property tests
        # Fast path: unit tests + PGlite-backed properties. Docker-backed PBT
        # (P4/P7/reservations properties) runs in integration-docker.yml.
        run: pnpm test
