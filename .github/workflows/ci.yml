name: CI

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - master
      - 'release/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Turborepo remote cache — optional.
    # On forks / first-time contributor PRs, TURBO_TOKEN will be empty and Turbo
    # silently falls back to the local filesystem cache. No hard failure.
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history helps Turborepo compute accurate task hashes and
          # benefits the optional remote cache.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier (format check)
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & property tests
        # Testcontainers-based suites (db, members, reservations) auto-skip
        # when Docker is unavailable on the runner. A dedicated pgTAP job
        # with a Postgres service container lands in a separate workflow.
        run: pnpm test
