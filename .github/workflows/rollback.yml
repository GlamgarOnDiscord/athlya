name: Rollback Production

# CN.7.3 — manual or webhook-triggered rollback to the previous stable deployment.
# Runbook: docs/runbooks/automatic-rollback.md
#
# Trigger modes:
#   1. Manual:          gh workflow run rollback.yml -f reason="..."
#   2. Axiom webhook:   POST /repos/{owner}/{repo}/actions/workflows/rollback.yml/dispatches
#      Fired when p99_ms > 2000 OR error_rate_5min > 0.02 for 5 consecutive minutes.
#
# Required secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SLACK_WEBHOOK_URL (optional)
# Required vars:    PRODUCTION_API_URL

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Rollback reason (shown in Slack notification)
        required: false
        type: string
        default: manual
      version_id:
        description: Target version ID (omit to roll back to previous stable)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-api-production-canary
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert credentials and vars
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set"
            exit 1
          fi
          if [ -z "${PRODUCTION_API_URL}" ]; then
            echo "::error::vars.PRODUCTION_API_URL is not set"
            exit 1
          fi

      - name: Rollback to previous stable
        env:
          TARGET_VERSION_ID: ${{ inputs.version_id }}
        run: |
          set -euo pipefail
          if [ -n "${TARGET_VERSION_ID}" ]; then
            echo "Rolling back to version: ${TARGET_VERSION_ID}"
            node scripts/canary-deploy.mjs rollback --env production --version-id "${TARGET_VERSION_ID}"
          else
            echo "Rolling back to previous stable version"
            node scripts/canary-deploy.mjs rollback --env production
          fi

      - name: Verify health after rollback
        run: bash scripts/wait-health-ready.sh "${PRODUCTION_API_URL}" 30 5

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ROLLBACK_REASON: ${{ inputs.reason }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL not configured — skipping Slack notification"
            exit 0
          fi
          SHA="${GITHUB_SHA:0:7}"
          EMOJI=$([[ "${JOB_STATUS}" == "success" ]] && echo ":white_check_mark:" || echo ":x:")
          PAYLOAD=$(jq -n \
            --arg text "${EMOJI} *Rollback ${JOB_STATUS}* — reason: ${ROLLBACK_REASON} | sha: ${SHA} | <${RUN_URL}|View run>" \
            '{"text": $text}')
          curl -s -X POST "${SLACK_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}"
