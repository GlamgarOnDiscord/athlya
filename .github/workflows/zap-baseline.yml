name: OWASP ZAP Baseline

# =====================================================================
# Task 13.2 / Requirement 29.1 — run the OWASP ZAP baseline scan on
# every pull request and block merge on any HIGH-severity finding.
#
# Missing target = failure (issue #340)
# -------------------------------------
# The scan target comes from the repository variable `ZAP_TARGET_URL`
# (Settings → Secrets and variables → Actions → Variables). A missing
# target FAILS the job on trusted runs (same-repo PRs, manual runs) so
# the workflow can never show green without having scanned anything.
# Only pull requests from forks skip cleanly: they cannot read
# repository variables and must not reach the scanning environment.
#
# Manual runs can override the variable through the
# `workflow_dispatch` `target_url` input — useful for poking a
# preview deployment without touching repo settings.
#
# Why baseline (passive) and not full (active)
# --------------------------------------------
# The baseline scan is passive: it only consumes the site's own
# traffic + spider crawl and never submits attack payloads, so it is
# safe to run against shared staging environments. The active /
# full scan is reserved for scheduled runs against a dedicated
# scanning environment (a future task).
#
# Why `allow_issue_writing: false`
# --------------------------------
# The zaproxy action can open GitHub issues for each finding, which
# quickly becomes noise on a monorepo with a shared staging URL.
# We rely on `fail_action: true` to block the PR on HIGH findings
# and on the uploaded HTML/JSON reports for human review.
# =====================================================================

on:
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Optional override for vars.ZAP_TARGET_URL (full https URL)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap:
    name: ZAP baseline scan (passive only)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      skipped: ${{ steps.guard.outputs.skipped }}

    steps:
      - name: Checkout
        # Needed so the baseline action can read `.zap/rules.tsv`.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Resolve target URL and guard on empty configuration
        id: guard
        env:
          VAR_TARGET: ${{ vars.ZAP_TARGET_URL }}
          INPUT_TARGET: ${{ github.event.inputs.target_url }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          # Dispatch input wins over the repo variable so humans can
          # target ad-hoc preview URLs without editing settings.
          TARGET="${INPUT_TARGET:-$VAR_TARGET}"

          if [ -z "$TARGET" ]; then
            if [ "$IS_FORK_PR" = "true" ]; then
              echo "::notice title=ZAP baseline skipped::Fork pull request: repository variables and the scan target are not available."
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              echo "target=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error title=ZAP baseline not configured::vars.ZAP_TARGET_URL is empty, so no DAST ran. Provision the synthetic-data scan target and set the variable (docs/operations/zap-activation.md)."
            echo "### ZAP baseline: FAILED — no target configured (vars.ZAP_TARGET_URL)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Resolved ZAP target: $TARGET"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Run ZAP baseline scan
        if: steps.guard.outputs.skipped == 'false'
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ steps.guard.outputs.target }}
          rules_file_name: '.zap/rules.tsv'
          # `-I` keeps the scan in baseline (passive) mode and treats
          # optional rules as INFO rather than WARN, so the noise
          # floor stays low while HIGH findings still fail the job.
          cmd_options: '-I'
          # We block the PR via the non-zero exit code from
          # `fail_action`; GitHub issues would duplicate that signal.
          allow_issue_writing: false
          fail_action: true

      - name: Upload ZAP reports
        if: always() && steps.guard.outputs.skipped == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zap-baseline-report
          path: |
            report_html.html
            report_json.json
          retention-days: 30
          if-no-files-found: warn
