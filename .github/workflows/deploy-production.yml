name: Deploy API

# Issues #129 (canary) + #130 (direct deploy + /health/ready gate).
# Runbooks: docs/runbooks/canary-deploy.md, docs/runbooks/deploy-production.md
#
# Required secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   MIGRATION_DB_URL_STAGING    — neondb_owner URL for staging Neon branch (DDL access)
#   MIGRATION_DB_URL_PRODUCTION — neondb_owner URL for production Neon branch (DDL access)
#   SENTRY_AUTH_TOKEN  — required for production-canary (#415); skipped for staging
#   SENTRY_DSN         — required for production-canary (#415)
# Required vars:
#   STAGING_API_URL   (e.g. https://staging.api.athlya.app)
#   PRODUCTION_API_URL (e.g. https://api.athlya.app)
#   SENTRY_ORG, SENTRY_PROJECT — required for production-canary; optional for staging
#
# GitHub Environments (recommended):
#   staging    — no approval
#   production — required reviewers before prod-canary / rollback
#
# Production phases (production-deploy, production-canary) refuse to run
# unless the "Staging gate" check succeeded on the same commit (#343).
#
# IMPORTANT — production deploy gate (issue #308):
# Before running `production-canary`, trigger the load-test workflow with
# target=production. It runs a 30-min soak (50 VUs) + spike (200 VUs burst)
# against staging. Both must pass before the canary proceeds.

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Deploy phase
        required: true
        type: choice
        options:
          - staging-deploy
          - production-deploy
          - staging-smoke
          - production-canary
          - rollback
      version_id:
        description: Rollback target version id (rollback phase only; omit for previous stable)
        required: false
        type: string
      wait_minutes:
        description: Bake minutes per canary step, 1-20 (production-canary only)
        required: false
        default: '10'
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-api-${{ inputs.phase }}
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.phase }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ (inputs.phase == 'staging-deploy' || inputs.phase == 'staging-smoke') && 'staging' || 'production' }}
    permissions:
      contents: read
      checks: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Issue #343 — production phases only ship a commit whose staging gate
      # (deploy + authenticated smoke + migration check + k6) succeeded.
      - name: Require green staging gate for this commit
        if: inputs.phase == 'production-deploy' || inputs.phase == 'production-canary'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/require-check-success.mjs --repo "${GITHUB_REPOSITORY}" --sha "${GITHUB_SHA}" --check "Staging gate"

      - name: Assert Cloudflare credentials
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set"
            exit 1
          fi

      - name: Assert API URLs configured
        if: inputs.phase != 'rollback'
        env:
          PHASE: ${{ inputs.phase }}
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail
          case "${PHASE}" in
            staging-deploy|staging-smoke)
              if [ -z "${STAGING_API_URL}" ]; then
                echo "::error::vars.STAGING_API_URL is empty"
                exit 1
              fi
              ;;
            production-deploy)
              if [ -z "${PRODUCTION_API_URL}" ]; then
                echo "::error::vars.PRODUCTION_API_URL is empty"
                exit 1
              fi
              ;;
            production-canary)
              if [ -z "${PRODUCTION_API_URL}" ] || [ -z "${STAGING_API_URL}" ]; then
                echo "::error::vars.PRODUCTION_API_URL and STAGING_API_URL must be set"
                exit 1
              fi
              ;;
          esac

      # Issue #328 — verify all required secrets are present on every worker
      # before uploading a new version. Exits non-zero if any secret is
      # missing, which hard-fails the deploy rather than deploying a
      # misconfigured worker silently.
      - name: Verify secrets (staging)
        if: inputs.phase == 'staging-deploy'
        run: node scripts/verify-secrets.mjs --env staging

      - name: Verify secrets (production)
        if: inputs.phase == 'production-deploy'
        run: node scripts/verify-secrets.mjs --env production

      - name: Check legal page placeholders (production)
        # Fails if bracket placeholders ([forme juridique], [numéro], etc.)
        # are still present in apps/web/src/app/legal/page.tsx or privacy/page.tsx.
        # Real legal metadata must be filled in before any production deploy (issue #516).
        if: inputs.phase == 'production-deploy'
        run: node scripts/check-legal-placeholders.mjs

      # Run DB migrations before deploying the Worker so the schema is
      # always ahead of the code, never behind. Uses the neondb_owner
      # connection string (BYPASSRLS) for DDL access; the app role
      # (athlya_app) cannot run DDL. Migration is idempotent — already-
      # applied migrations are skipped by the _athlya_migrations table.
      - name: Run DB migrations (staging)
        if: inputs.phase == 'staging-deploy'
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DB_URL_STAGING }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::MIGRATION_DB_URL_STAGING secret is not set — cannot run migrations"
            exit 1
          fi
          node packages/db/scripts/migrate.mjs
          echo "::notice::Staging migrations applied successfully"

      - name: Run DB migrations (production)
        if: inputs.phase == 'production-deploy'
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DB_URL_PRODUCTION }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::MIGRATION_DB_URL_PRODUCTION secret is not set — cannot run migrations"
            exit 1
          fi
          node packages/db/scripts/migrate.mjs
          echo "::notice::Production migrations applied successfully"

      - name: Deploy staging (wrangler + ready gate)
        if: inputs.phase == 'staging-deploy'
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_SHA:0:7}"
          # Issue #333 — sub-workers FIRST, gateway LAST.
          #
          # The old order (gateway → sub-workers) causes 100% failure on routes
          # that depend on new sub-worker behaviour during the 2-3 minute window
          # between the gateway and sub-worker deploys: the new gateway calls
          # sub-worker APIs that don't exist yet on v(n).
          #
          # Correct order (issue #333):
          #   1. Auth sub-worker  — lowest risk, no upstream dependencies
          #   2. Reservations sub-worker
          #   3. Billing sub-worker
          #   4. Health-check the old gateway + new sub-workers — confirms the
          #      existing traffic path is still healthy before promoting the
          #      gateway to v(n+1).
          #   5. Main gateway — promoted last; by this point all sub-workers
          #      already expose the new contract so 0% of requests see a
          #      version-skew window.
          pnpm --filter @athlya/api exec wrangler deploy -c wrangler.auth.toml --env staging --var "VERSION:${VERSION}" --outdir dist/auth
          pnpm --filter @athlya/api exec wrangler deploy -c wrangler.reservations.toml --env staging --var "VERSION:${VERSION}" --outdir dist/reservations
          pnpm --filter @athlya/api exec wrangler deploy -c wrangler.billing.toml --env staging --var "VERSION:${VERSION}" --outdir dist/billing
          # Health-check via the old gateway + new sub-workers before promoting
          # the gateway. A failure here rolls back all sub-workers.
          bash scripts/wait-health-ready.sh "${STAGING_API_URL}"
          # Main gateway (scheduled + queue handlers, /health, /openapi.json)
          pnpm --filter @athlya/api exec wrangler deploy --env staging --var "VERSION:${VERSION}" --outdir dist
          bash scripts/wait-health-ready.sh "${STAGING_API_URL}"

      # Smoke each route group after staging deploy — verifies no sub-worker
      # is returning 5xx. A 4xx (auth required) is a healthy response.
      # Rolls back if any route group fails (issue #301).
      - name: Smoke all route groups (staging)
        if: inputs.phase == 'staging-deploy'
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
        run: |
          set -euo pipefail
          node scripts/smoke-routes.mjs --base-url "${STAGING_API_URL}"

      - name: Deploy production (wrangler + ready gate)
        if: inputs.phase == 'production-deploy'
        env:
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_SHA:0:7}"
          # Issue #333 — sub-workers FIRST, gateway LAST (same rationale as
          # staging above). Sub-workers are backwards-compatible per the
          # expand/contract pattern (CLAUDE.md); the old gateway routes to
          # them safely until it is replaced.
          pnpm --filter @athlya/api exec wrangler deploy -c wrangler.auth.toml --env production --var "VERSION:${VERSION}" --outdir dist/auth
          pnpm --filter @athlya/api exec wrangler deploy -c wrangler.reservations.toml --env production --var "VERSION:${VERSION}" --outdir dist/reservations
          pnpm --filter @athlya/api exec wrangler deploy -c wrangler.billing.toml --env production --var "VERSION:${VERSION}" --outdir dist/billing
          # Pre-gateway health check — old gateway + new sub-workers must be
          # healthy before the gateway is promoted.
          bash scripts/wait-health-ready.sh "${PRODUCTION_API_URL}"
          # Main gateway promoted last (issue #333).
          pnpm --filter @athlya/api exec wrangler deploy --env production --var "VERSION:${VERSION}" --outdir dist
          bash scripts/wait-health-ready.sh "${PRODUCTION_API_URL}"

      # Smoke all route groups after production deploy — issue #301.
      - name: Smoke all route groups (production)
        if: inputs.phase == 'production-deploy'
        env:
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail
          node scripts/smoke-routes.mjs --base-url "${PRODUCTION_API_URL}"

      # Issue #138 — upload source maps to Sentry + record the release so
      # prod stack traces de-minify to file:line. The release name is the
      # 7-char git sha, identical to the `VERSION` var tagged on every
      # captured event (see packages/api/src/sentry.ts → event.release),
      # so Sentry matches the uploaded map to the incoming event. The var
      # must be passed as `--var VERSION:<sha7>`: wrangler splits on `:`.
      # The gateway bundles into packages/api/dist and each sub-worker into
      # packages/api/dist/<worker>; inject + upload walk the tree, so every
      # Worker sharing the release gets its maps.
      #
      # Soft-gated on SENTRY_AUTH_TOKEN: skips cleanly when the secret is
      # absent (e.g. fork PRs) rather than failing the deploy.
      - name: Sentry release + source maps
        if: inputs.phase == 'staging-deploy' || inputs.phase == 'production-deploy'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          DEPLOY_ENV_NAME: ${{ inputs.phase == 'production-deploy' && 'production' || 'staging' }}
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ] || [ -z "${SENTRY_ORG:-}" ] || [ -z "${SENTRY_PROJECT:-}" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT not configured — skipping source map upload (#138)"
            exit 0
          fi
          # `pnpm --filter @athlya/api exec` runs in packages/api, so that is
          # where wrangler wrote --outdir dist.
          if [ ! -d packages/api/dist ]; then
            echo "::error::packages/api/dist not produced by wrangler deploy --outdir dist"
            exit 1
          fi
          RELEASE="${GITHUB_SHA:0:7}"
          ENV_NAME="${DEPLOY_ENV_NAME}"
          # Pinned CLI (devDependency @sentry/cli, exact version) invoked
          # through pnpm so CI runs a lockfile-reviewed artifact rather
          # than a floating npx range resolved while the auth token is in
          # the environment.
          SENTRY_CLI="pnpm --filter @athlya/api exec sentry-cli"
          $SENTRY_CLI releases new "$RELEASE"
          $SENTRY_CLI sourcemaps inject dist
          $SENTRY_CLI sourcemaps upload --release "$RELEASE" dist
          $SENTRY_CLI releases set-commits "$RELEASE" --auto --ignore-missing
          $SENTRY_CLI releases finalize "$RELEASE"
          $SENTRY_CLI releases deploys "$RELEASE" new -e "$ENV_NAME"

      - name: Staging smoke (upload + ready gate)
        if: inputs.phase == 'staging-smoke'
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
        run: node scripts/canary-deploy.mjs staging-smoke --base-url "${STAGING_API_URL}"

      - name: Require Sentry config for production canary
        if: inputs.phase == 'production-canary'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${SENTRY_AUTH_TOKEN:-}" ] && missing+=("SENTRY_AUTH_TOKEN")
          [ -z "${SENTRY_ORG:-}" ]        && missing+=("SENTRY_ORG")
          [ -z "${SENTRY_PROJECT:-}" ]    && missing+=("SENTRY_PROJECT")
          [ -z "${SENTRY_DSN:-}" ]        && missing+=("SENTRY_DSN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Production canary requires Sentry telemetry. Missing: ${missing[*]}"
            echo "::error::Without error attribution and source maps, a bad rollout cannot be diagnosed quickly. Provision the secrets before proceeding (issue #415)."
            exit 1
          fi
          echo "Sentry config present — proceeding with canary."

      - name: Production canary (5% → 25% → 100%)
        if: inputs.phase == 'production-canary'
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
          # Error-budget gate (#404): the canary release is the 7-char commit
          # SHA, the same release direct deploys tag and upload source maps under.
          RELEASE_SHA: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          CANARY_MAX_ERRORS: ${{ vars.CANARY_MAX_ERRORS }}
          WAIT_MINUTES: ${{ inputs.wait_minutes }}
        run: |
          set -euo pipefail
          export VERSION="${RELEASE_SHA:0:7}"
          # Three bake windows (5%, 25% and 100%) must fit in the 90-minute job.
          if ! [[ "${WAIT_MINUTES}" =~ ^([1-9]|1[0-9]|20)$ ]]; then
            echo "::error::wait_minutes must be an integer between 1 and 20"
            exit 1
          fi
          node scripts/canary-deploy.mjs production-canary \
            --base-url "${PRODUCTION_API_URL}" \
            --staging-url "${STAGING_API_URL}" \
            --wait-min "${WAIT_MINUTES}" \
            --steps "5,25,100"

      # Issue #276 — roll back all workers when a staging or production
      # deploy step fails mid-sequence. Issue #331: || true removed so a
      # failing rollback surfaces immediately.
      # Issue #333: gateway is rolled back FIRST (it was promoted last),
      # then sub-workers in reverse deploy order, so the old gateway is
      # never left routing to a partially-rolled-back sub-worker set.
      - name: Rollback staging workers on failure
        if: failure() && inputs.phase == 'staging-deploy'
        run: |
          echo "::warning::Staging deploy failed — rolling back all staging workers (gateway first)"
          pnpm --filter @athlya/api exec wrangler rollback --env staging
          pnpm --filter @athlya/api exec wrangler rollback -c wrangler.billing.toml --env staging
          pnpm --filter @athlya/api exec wrangler rollback -c wrangler.reservations.toml --env staging
          pnpm --filter @athlya/api exec wrangler rollback -c wrangler.auth.toml --env staging
          echo "::error::Staging workers rolled back."

      - name: Rollback production workers on failure
        if: failure() && inputs.phase == 'production-deploy'
        run: |
          echo "::warning::Production deploy failed — rolling back all production workers (gateway first)"
          pnpm --filter @athlya/api exec wrangler rollback --env production
          pnpm --filter @athlya/api exec wrangler rollback -c wrangler.billing.toml --env production
          pnpm --filter @athlya/api exec wrangler rollback -c wrangler.reservations.toml --env production
          pnpm --filter @athlya/api exec wrangler rollback -c wrangler.auth.toml --env production
          echo "::error::Production workers rolled back."

      - name: Rollback production
        if: inputs.phase == 'rollback'
        env:
          VERSION_ID: ${{ inputs.version_id }}
        run: |
          set -euo pipefail
          if [ -n "${VERSION_ID}" ]; then
            uuid_re='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
            hex_re='^[0-9a-fA-F]{32}$'
            if ! [[ "${VERSION_ID}" =~ $uuid_re || "${VERSION_ID}" =~ $hex_re ]]; then
              echo "::error::version_id must be a Cloudflare Worker version id (UUID or 32-char hex)"
              exit 1
            fi
            node scripts/canary-deploy.mjs rollback --env production --version-id "${VERSION_ID}"
          else
            node scripts/canary-deploy.mjs rollback --env production
          fi
