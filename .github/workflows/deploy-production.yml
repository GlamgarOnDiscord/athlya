name: Deploy API

# Issues #129 (canary) + #130 (direct deploy + /health/ready gate).
# Runbooks: docs/runbooks/canary-deploy.md, docs/runbooks/deploy-production.md
#
# Required secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   MIGRATION_DB_URL_STAGING    — neondb_owner URL for staging Neon branch (DDL access)
#   MIGRATION_DB_URL_PRODUCTION — neondb_owner URL for production Neon branch (DDL access)
#   SENTRY_AUTH_TOKEN  (optional — #138 source map upload; skipped if unset)
# Required vars:
#   STAGING_API_URL   (e.g. https://staging.api.athlya.app)
#   PRODUCTION_API_URL (e.g. https://api.athlya.app)
#   SENTRY_ORG, SENTRY_PROJECT (optional — #138 source map upload)
#
# GitHub Environments (recommended):
#   staging    — no approval
#   production — required reviewers before prod-canary / rollback

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Deploy phase
        required: true
        type: choice
        options:
          - staging-deploy
          - production-deploy
          - staging-smoke
          - production-canary
          - rollback
      version_id:
        description: Rollback target version id (rollback phase only; omit for previous stable)
        required: false
        type: string
      wait_minutes:
        description: Minutes between canary steps (production-canary only)
        required: false
        default: '10'
        type: string

concurrency:
  group: deploy-api-${{ inputs.phase }}
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.phase }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ (inputs.phase == 'staging-deploy' || inputs.phase == 'staging-smoke') && 'staging' || 'production' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert Cloudflare credentials
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set"
            exit 1
          fi

      - name: Assert API URLs configured
        if: inputs.phase != 'rollback'
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail
          case "${{ inputs.phase }}" in
            staging-deploy|staging-smoke)
              if [ -z "${STAGING_API_URL}" ]; then
                echo "::error::vars.STAGING_API_URL is empty"
                exit 1
              fi
              ;;
            production-deploy)
              if [ -z "${PRODUCTION_API_URL}" ]; then
                echo "::error::vars.PRODUCTION_API_URL is empty"
                exit 1
              fi
              ;;
            production-canary)
              if [ -z "${PRODUCTION_API_URL}" ] || [ -z "${STAGING_API_URL}" ]; then
                echo "::error::vars.PRODUCTION_API_URL and STAGING_API_URL must be set"
                exit 1
              fi
              ;;
          esac

      # Issue #328 — verify all required secrets are present on every worker
      # before uploading a new version. Exits non-zero if any secret is
      # missing, which hard-fails the deploy rather than deploying a
      # misconfigured worker silently.
      - name: Verify secrets (staging)
        if: inputs.phase == 'staging-deploy'
        run: node scripts/verify-secrets.mjs --env staging

      - name: Verify secrets (production)
        if: inputs.phase == 'production-deploy'
        run: node scripts/verify-secrets.mjs --env production

      # Run DB migrations before deploying the Worker so the schema is
      # always ahead of the code, never behind. Uses the neondb_owner
      # connection string (BYPASSRLS) for DDL access; the app role
      # (athlya_app) cannot run DDL. Migration is idempotent — already-
      # applied migrations are skipped by the _athlya_migrations table.
      - name: Run DB migrations (staging)
        if: inputs.phase == 'staging-deploy'
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DB_URL_STAGING }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::MIGRATION_DB_URL_STAGING secret is not set — cannot run migrations"
            exit 1
          fi
          node packages/db/scripts/migrate.mjs
          echo "::notice::Staging migrations applied successfully"

      - name: Run DB migrations (production)
        if: inputs.phase == 'production-deploy'
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DB_URL_PRODUCTION }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::MIGRATION_DB_URL_PRODUCTION secret is not set — cannot run migrations"
            exit 1
          fi
          node packages/db/scripts/migrate.mjs
          echo "::notice::Production migrations applied successfully"

      - name: Deploy staging (wrangler + ready gate)
        if: inputs.phase == 'staging-deploy'
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_SHA:0:7}"
          # Main gateway (scheduled + queue handlers, /health, /openapi.json)
          pnpm --filter @athlya/api exec wrangler deploy --env staging --var "VERSION=${VERSION}" --outdir dist
          # Bulkhead sub-workers (issue #230): deploy in sequence so route
          # ownership transfers atomically — auth first (lowest risk), then
          # reservations, then billing.
          pnpm --filter @athlya/api exec wrangler deploy -c wrangler.auth.toml --env staging --var "VERSION=${VERSION}"
          pnpm --filter @athlya/api exec wrangler deploy -c wrangler.reservations.toml --env staging --var "VERSION=${VERSION}"
          pnpm --filter @athlya/api exec wrangler deploy -c wrangler.billing.toml --env staging --var "VERSION=${VERSION}"
          bash scripts/wait-health-ready.sh "${STAGING_API_URL}"

      # Smoke each route group after staging deploy — verifies no sub-worker
      # is returning 5xx. A 4xx (auth required) is a healthy response.
      # Rolls back if any route group fails (issue #301).
      - name: Smoke all route groups (staging)
        if: inputs.phase == 'staging-deploy'
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
        run: |
          set -euo pipefail
          node scripts/smoke-routes.mjs --base-url "${STAGING_API_URL}"

      - name: Deploy production (wrangler + ready gate)
        if: inputs.phase == 'production-deploy'
        env:
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_SHA:0:7}"
          # Main gateway
          pnpm --filter @athlya/api exec wrangler deploy --env production --var "VERSION=${VERSION}" --outdir dist
          # Bulkhead sub-workers (issue #230)
          pnpm --filter @athlya/api exec wrangler deploy -c wrangler.auth.toml --env production --var "VERSION=${VERSION}"
          pnpm --filter @athlya/api exec wrangler deploy -c wrangler.reservations.toml --env production --var "VERSION=${VERSION}"
          pnpm --filter @athlya/api exec wrangler deploy -c wrangler.billing.toml --env production --var "VERSION=${VERSION}"
          bash scripts/wait-health-ready.sh "${PRODUCTION_API_URL}"

      # Smoke all route groups after production deploy — issue #301.
      - name: Smoke all route groups (production)
        if: inputs.phase == 'production-deploy'
        env:
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail
          node scripts/smoke-routes.mjs --base-url "${PRODUCTION_API_URL}"

      # Issue #138 — upload source maps to Sentry + record the release so
      # prod stack traces de-minify to file:line. The release name is the
      # 7-char git sha, identical to the `VERSION` var tagged on every
      # captured event (see packages/api/src/sentry.ts → event.release),
      # so Sentry matches the uploaded map to the incoming event.
      #
      # Soft-gated on SENTRY_AUTH_TOKEN: skips cleanly when the secret is
      # absent (e.g. fork PRs) rather than failing the deploy.
      - name: Sentry release + source maps
        if: inputs.phase == 'staging-deploy' || inputs.phase == 'production-deploy'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ] || [ -z "${SENTRY_ORG:-}" ] || [ -z "${SENTRY_PROJECT:-}" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT not configured — skipping source map upload (#138)"
            exit 0
          fi
          if [ ! -d dist ]; then
            echo "::error::dist/ not produced by wrangler deploy --outdir dist"
            exit 1
          fi
          RELEASE="${GITHUB_SHA:0:7}"
          ENV_NAME="${{ inputs.phase == 'production-deploy' && 'production' || 'staging' }}"
          # Pinned CLI (devDependency @sentry/cli, exact version) invoked
          # through pnpm so CI runs a lockfile-reviewed artifact rather
          # than a floating npx range resolved while the auth token is in
          # the environment.
          SENTRY_CLI="pnpm --filter @athlya/api exec sentry-cli"
          $SENTRY_CLI releases new "$RELEASE"
          $SENTRY_CLI sourcemaps inject dist
          $SENTRY_CLI sourcemaps upload --release "$RELEASE" dist
          $SENTRY_CLI releases set-commits "$RELEASE" --auto --ignore-missing
          $SENTRY_CLI releases finalize "$RELEASE"
          $SENTRY_CLI releases deploys "$RELEASE" new -e "$ENV_NAME"

      - name: Staging smoke (upload + ready gate)
        if: inputs.phase == 'staging-smoke'
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
        run: node scripts/canary-deploy.mjs staging-smoke --base-url "${STAGING_API_URL}"

      - name: Production canary (5% → 25% → 100%)
        if: inputs.phase == 'production-canary'
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          node scripts/canary-deploy.mjs production-canary \
            --base-url "${PRODUCTION_API_URL}" \
            --staging-url "${STAGING_API_URL}" \
            --wait-min "${{ inputs.wait_minutes }}" \
            --steps "5,25,100"

      # Issue #276 — roll back sub-workers when a staging or production
      # deploy step fails mid-sequence (e.g. billing fails after auth and
      # reservations have already been promoted). Each command uses || true
      # so one failing rollback does not block the others.
      - name: Rollback staging sub-workers on failure
        if: failure() && inputs.phase == 'staging-deploy'
        run: |
          echo "::warning::Staging deploy failed — rolling back staging sub-workers"
          pnpm --filter @athlya/api exec wrangler rollback -c wrangler.auth.toml --env staging || true
          pnpm --filter @athlya/api exec wrangler rollback -c wrangler.reservations.toml --env staging || true
          pnpm --filter @athlya/api exec wrangler rollback -c wrangler.billing.toml --env staging || true
          echo "::error::Staging sub-workers rolled back."

      - name: Rollback production sub-workers on failure
        if: failure() && inputs.phase == 'production-deploy'
        run: |
          echo "::warning::Production deploy failed — rolling back production sub-workers"
          pnpm --filter @athlya/api exec wrangler rollback -c wrangler.auth.toml --env production || true
          pnpm --filter @athlya/api exec wrangler rollback -c wrangler.reservations.toml --env production || true
          pnpm --filter @athlya/api exec wrangler rollback -c wrangler.billing.toml --env production || true
          echo "::error::Production sub-workers rolled back."

      - name: Rollback production
        if: inputs.phase == 'rollback'
        run: |
          if [ -n "${{ inputs.version_id }}" ]; then
            node scripts/canary-deploy.mjs rollback --env production --version-id "${{ inputs.version_id }}"
          else
            node scripts/canary-deploy.mjs rollback --env production
          fi
