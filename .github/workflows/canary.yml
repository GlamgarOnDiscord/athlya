name: Canary Deploy

# CN.7.1 — automatic canary promotion on every push to master.
# Runbook: docs/runbooks/canary-deploy.md
#
# Required secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Required vars:    PRODUCTION_API_URL, STAGING_API_URL
#
# The canary-deploy.mjs script handles:
#   • upload           — wrangler versions upload → new VERSION_ID
#   • promote          — wrangler deployments create --percentage N
#   • health check     — /health/ready polled at the end (after 100%)
#   • rollback         — wrangler rollback on health failure
#
# Steps: 1% → 10-min sleep → 10% → 10-min sleep → 100% → /health/ready
# Bake windows are time-based sleeps; rollback triggers if the final
# health check or any step throws.

on:
  push:
    branches:
      - master
    paths:
      - 'packages/api/**'
      - '.github/workflows/canary.yml'

concurrency:
  group: deploy-api-production-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Canary deploy (1% → 10% → 100%)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check canary provisioning
        id: config
        run: |
          set -euo pipefail
          missing=()
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            missing+=("CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID")
          fi
          if [ -z "${PRODUCTION_API_URL}" ]; then
            missing+=("vars.PRODUCTION_API_URL")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping canary deploy; missing ${missing[*]}. Configure the repository or production environment before enabling automatic canary deploys."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Pre-flight staging health check
        if: steps.config.outputs.ready == 'true' && env.STAGING_API_URL != ''
        run: bash scripts/wait-health-ready.sh "${STAGING_API_URL}" 10 5

      # Issue #404 — sub-workers FIRST, gateway canary LAST.
      #
      # The old order (gateway canary → sub-workers) created a version-skew
      # window: during the 1 % → 100 % bake, the new gateway called old
      # sub-workers that did not yet expose the new contract, causing 5xx on
      # every auth / reservations / billing route that touched a new API.
      #
      # Correct order (mirrors deploy-production.yml issue #333):
      #   1. Auth sub-worker
      #   2. Reservations sub-worker
      #   3. Billing sub-worker
      #   4. Health-check via old gateway + new sub-workers — confirms the
      #      existing traffic path is healthy before the gateway is promoted.
      #   5. Gateway canary (1 % → 10 % → 100 %) — by this point every
      #      sub-worker already exposes the new contract so no request hits
      #      a version-skew window during any canary stage.
      - name: Deploy bulkhead sub-workers (auth / reservations / billing)
        id: deploy_subworkers
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          pnpm --filter @athlya/api exec wrangler deploy -c wrangler.auth.toml --env production
          pnpm --filter @athlya/api exec wrangler deploy -c wrangler.reservations.toml --env production
          pnpm --filter @athlya/api exec wrangler deploy -c wrangler.billing.toml --env production

      - name: Pre-canary health check (old gateway + new sub-workers)
        if: steps.config.outputs.ready == 'true' && steps.deploy_subworkers.outcome == 'success'
        run: bash scripts/wait-health-ready.sh "${PRODUCTION_API_URL}" 10 5

      - name: Canary 1% → 10% → 100%
        id: canary
        if: steps.config.outputs.ready == 'true' && steps.deploy_subworkers.outcome == 'success'
        run: |
          set -euo pipefail
          node scripts/canary-deploy.mjs production-canary \
            --base-url "${PRODUCTION_API_URL}" \
            --wait-min "10" \
            --steps "1,10,100"

      # Issue #404 — rollback must fail loudly so the on-call engineer
      # sees the failure immediately. The previous || true silently swallowed
      # rollback errors, leaving the fleet in an undefined mixed-version state.
      # Each rollback command runs independently; a failure in one is surfaced
      # as a non-zero exit so the step fails and the workflow is marked red.
      - name: Rollback on failure
        if: failure() && steps.config.outputs.ready == 'true'
        run: |
          set +e
          echo "::warning::Deploy failed — rolling back production gateway and sub-workers"
          ROLLBACK_FAILED=0

          node scripts/canary-deploy.mjs rollback --env production
          if [ $? -ne 0 ]; then
            echo "::error::Gateway rollback FAILED"
            ROLLBACK_FAILED=1
          fi

          pnpm --filter @athlya/api exec wrangler rollback -c wrangler.auth.toml --env production
          if [ $? -ne 0 ]; then
            echo "::error::Auth sub-worker rollback FAILED"
            ROLLBACK_FAILED=1
          fi

          pnpm --filter @athlya/api exec wrangler rollback -c wrangler.reservations.toml --env production
          if [ $? -ne 0 ]; then
            echo "::error::Reservations sub-worker rollback FAILED"
            ROLLBACK_FAILED=1
          fi

          pnpm --filter @athlya/api exec wrangler rollback -c wrangler.billing.toml --env production
          if [ $? -ne 0 ]; then
            echo "::error::Billing sub-worker rollback FAILED"
            ROLLBACK_FAILED=1
          fi

          if [ $ROLLBACK_FAILED -ne 0 ]; then
            echo "::error::One or more rollbacks failed. Fleet may be in a mixed-version state. Page on-call immediately."
            exit 1
          fi
          echo "::notice::All workers rolled back successfully."
