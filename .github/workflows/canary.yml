name: Canary Deploy

# CN.7.1 — automatic canary promotion on every push to master.
# Runbook: docs/runbooks/canary-deploy.md
#
# Required secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Required vars:    PRODUCTION_API_URL, STAGING_API_URL
#
# The canary-deploy.mjs script handles:
#   • upload           — wrangler versions upload → new VERSION_ID
#   • promote          — wrangler deployments create --percentage N
#   • health check     — /health/ready polled at the end (after 100%)
#   • rollback         — wrangler rollback on health failure
#
# Steps: 1% → 10-min sleep → 10% → 10-min sleep → 100% → /health/ready
# Bake windows are time-based sleeps; rollback triggers if the final
# health check or any step throws.

on:
  push:
    branches:
      - master
    paths:
      - 'packages/api/**'
      - '.github/workflows/canary.yml'

concurrency:
  group: deploy-api-production-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Canary deploy (1% → 10% → 100%)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check canary provisioning
        id: config
        run: |
          set -euo pipefail
          missing=()
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            missing+=("CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID")
          fi
          if [ -z "${PRODUCTION_API_URL}" ]; then
            missing+=("vars.PRODUCTION_API_URL")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping canary deploy; missing ${missing[*]}. Configure the repository or production environment before enabling automatic canary deploys."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Pre-flight staging health check
        if: steps.config.outputs.ready == 'true' && env.STAGING_API_URL != ''
        run: bash scripts/wait-health-ready.sh "${STAGING_API_URL}" 10 5

      - name: Canary 1% → 10% → 100%
        id: canary
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          node scripts/canary-deploy.mjs production-canary \
            --base-url "${PRODUCTION_API_URL}" \
            --wait-min "10" \
            --steps "1,10,100"

      # Issue #230 — deploy bulkhead sub-workers after the main canary
      # completes its 100% promotion. Sub-workers take over specific route
      # prefixes (auth, reservations, billing) immediately at 100%; no
      # gradual rollout needed because each sub-worker is isolated by CF
      # routing and a bad deploy affects only its own domain.
      - name: Deploy bulkhead sub-workers (auth / reservations / billing)
        id: deploy_subworkers
        if: steps.config.outputs.ready == 'true' && steps.canary.outcome == 'success'
        run: |
          set -euo pipefail
          pnpm --filter @athlya/api exec wrangler deploy -c wrangler.auth.toml --env production
          pnpm --filter @athlya/api exec wrangler deploy -c wrangler.reservations.toml --env production
          pnpm --filter @athlya/api exec wrangler deploy -c wrangler.billing.toml --env production

      # Issue #276 — roll back ALL Workers (main + sub-workers) on any failure
      # so the fleet never sits in a mixed-version state. Each command uses
      # || true so one failing rollback does not block the others.
      - name: Rollback on failure
        if: failure() && steps.config.outputs.ready == 'true'
        run: |
          echo "::warning::Deploy failed — rolling back production main Worker and sub-workers"
          node scripts/canary-deploy.mjs rollback --env production || true
          pnpm --filter @athlya/api exec wrangler rollback -c wrangler.auth.toml --env production || true
          pnpm --filter @athlya/api exec wrangler rollback -c wrangler.reservations.toml --env production || true
          pnpm --filter @athlya/api exec wrangler rollback -c wrangler.billing.toml --env production || true
          echo "::error::Deploy rolled back. Check logs for the failure."
