name: Canary Deploy

# CN.7.1 — automatic canary promotion on every push to master.
# Runbook: docs/runbooks/canary-deploy.md
#
# Required secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SENTRY_AUTH_TOKEN,
#                   SENTRY_DSN (plus the Worker-side secrets verify-secrets.mjs checks)
# Required vars:    PRODUCTION_API_URL, STAGING_API_URL, SENTRY_ORG, SENTRY_PROJECT
# Optional:         CANARY_MAX_ERRORS var (default 5; must be a non-negative integer)
#                   CANARY_MAX_P95_MS var (default 1500), CANARY_LATENCY_SAMPLES var (default 20)
#
# The Sentry release is the 7-char commit SHA, set as VERSION on the gateway
# AND every sub-worker so the error budget covers the whole fleet.
#
# Source maps + Sentry release (#415): every Worker is bundled with
# --outdir under packages/api/dist (sub-workers by a dry run, the gateway by
# `versions upload`); scripts/sentry-release.sh creates the release and
# uploads the maps BEFORE any new code takes traffic, then finalizes the
# release and records the production deploy marker once the canary held
# at 100 %.
#
# The canary-deploy.mjs script handles:
#   • upload       — wrangler versions upload with VERSION:<sha7> (Sentry release)
#   • promote      — wrangler versions deploy --percentage N
#   • reachability — unauthenticated scripts/smoke-routes.mjs after every
#                    traffic shift (production login is behind Turnstile)
#   • bake gate    — /health/ready every 60 s, then the Sentry error count
#                    for the release must stay within CANARY_MAX_ERRORS (#404);
#                    runs at every step, 100 % included
#   • latency gate   — p95 of /health/ready pinned to the canary version
#                    (Cloudflare-Workers-Version-Overrides) must stay within
#                    CANARY_MAX_P95_MS (default 1500) at every step (#415)
#   • rollback     — the workflow rolls back gateway + sub-workers on failure
#
# A missing prerequisite FAILS the run: a merge to master must not look
# deployed when nothing was promoted.

on:
  push:
    branches:
      - master
    # Every package @athlya/api reaches through runtime dependencies, the
    # build config they extend, the lockfile, and every script this workflow
    # runs (with its local imports) — checked by scripts/check-canary-paths.mjs (#404).
    paths:
      - 'packages/ai-coach/**'
      - 'packages/api/**'
      - 'packages/auth/**'
      - 'packages/billing/**'
      - 'packages/db/**'
      - 'packages/members/**'
      - 'packages/notifications/**'
      - 'packages/programs/**'
      - 'packages/ratelimit/**'
      - 'packages/reservations/**'
      - 'packages/shared/**'
      - 'packages/tsconfig/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/canary-deploy.mjs'
      - 'scripts/canary-error-budget.mjs'
      - 'scripts/canary-latency.mjs'
      - 'scripts/sentry-release.sh'
      - 'scripts/smoke-routes.mjs'
      - 'scripts/verify-secrets.mjs'
      - 'scripts/wait-health-ready.sh'
      - 'scripts/wrangler-queues.mjs'
      - '.github/workflows/canary.yml'

permissions:
  contents: read

concurrency:
  group: deploy-api-production-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Canary deploy (1% → 10% → 100%)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}
      # Sentry release for every Worker of this rollout — same 7-char SHA the
      # direct deploys tag and upload source maps under (deploy-production.yml).
      RELEASE_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check canary provisioning
        id: config
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${CLOUDFLARE_API_TOKEN}" ] || missing+=("secrets.CLOUDFLARE_API_TOKEN")
          [ -n "${CLOUDFLARE_ACCOUNT_ID}" ] || missing+=("secrets.CLOUDFLARE_ACCOUNT_ID")
          [ -n "${PRODUCTION_API_URL}" ] || missing+=("vars.PRODUCTION_API_URL")
          [ -n "${SENTRY_AUTH_TOKEN}" ] || missing+=("secrets.SENTRY_AUTH_TOKEN")
          [ -n "${SENTRY_ORG}" ] || missing+=("vars.SENTRY_ORG")
          [ -n "${SENTRY_PROJECT}" ] || missing+=("vars.SENTRY_PROJECT")
          [ -n "${SENTRY_DSN}" ] || missing+=("secrets.SENTRY_DSN")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "### Canary: FAILED — not provisioned: ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Canary not provisioned::missing ${missing[*]}"
            exit 1
          fi
          echo "release=${RELEASE_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # The error budget only sees events the Workers actually send: without
      # their SENTRY_DSN secret it would count zero and promote blind.
      - name: Verify Worker secrets (production)
        if: steps.config.outputs.ready == 'true'
        run: node scripts/verify-secrets.mjs --env production

      - name: Pre-flight staging health check
        if: steps.config.outputs.ready == 'true' && env.STAGING_API_URL != ''
        run: bash scripts/wait-health-ready.sh "${STAGING_API_URL}" 10 5

      # Issue #415 — source maps reach Sentry before ANY new code takes
      # traffic. The sub-workers are bundled with a dry run (same inputs and
      # flags as the deploy below, so the same bundles) and the gateway
      # version is uploaded without shifting traffic; the release and every
      # map are then uploaded, and only after that do the deploys start.
      - name: Bundle sub-workers (dry run, no deploy)
        id: bundle_subworkers
        if: steps.config.outputs.ready == 'true'
        env:
          VERSION: ${{ steps.config.outputs.release }}
        run: |
          set -euo pipefail
          for worker in auth reservations billing; do
            pnpm --filter @athlya/api exec wrangler deploy -c "wrangler.${worker}.toml" --env production --var "VERSION:${VERSION}" --outdir "dist/${worker}" --dry-run
          done

      # Issue #697 — the Axiom log Tail Worker before any API Worker: they
      # name it in `tail_consumers`. It only forwards log lines, so it is not
      # part of the rollback below (an older API version tails to it too).
      - name: Deploy Axiom log tail Worker
        id: deploy_tail
        if: steps.config.outputs.ready == 'true' && steps.bundle_subworkers.outcome == 'success'
        run: pnpm --filter @athlya/api exec wrangler deploy -c wrangler.axiom-tail.toml --env production --outdir dist/axiom-tail

      # Uploading a version shifts no traffic: the gateway keeps serving the
      # previous deployment until canary-deploy.mjs promotes this version.
      - name: Upload gateway version
        id: upload_gateway
        if: steps.config.outputs.ready == 'true' && steps.deploy_tail.outcome == 'success'
        env:
          VERSION: ${{ steps.config.outputs.release }}
        run: |
          set -euo pipefail
          node scripts/canary-deploy.mjs upload --env production \
            --message "production-canary-${VERSION}" --outdir dist

      - name: Sentry release + source maps
        id: sentry_prepare
        if: steps.config.outputs.ready == 'true' && steps.upload_gateway.outcome == 'success'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: bash scripts/sentry-release.sh prepare production

      # Issue #404 — sub-workers FIRST, gateway canary LAST.
      #
      # The old order (gateway canary → sub-workers) created a version-skew
      # window: during the 1 % → 100 % bake, the new gateway called old
      # sub-workers that did not yet expose the new contract, causing 5xx on
      # every auth / reservations / billing route that touched a new API.
      #
      # Correct order (mirrors deploy-production.yml issue #333):
      #   1. Auth sub-worker
      #   2. Reservations sub-worker
      #   3. Billing sub-worker
      #   4. Health-check via old gateway + new sub-workers — confirms the
      #      existing traffic path is healthy before the gateway is promoted.
      #   5. Gateway canary (1 % → 10 % → 100 %) — by this point every
      #      sub-worker already exposes the new contract so no request hits
      #      a version-skew window during any canary stage.
      - name: Deploy bulkhead sub-workers (auth / reservations / billing)
        id: deploy_subworkers
        if: steps.config.outputs.ready == 'true' && steps.sentry_prepare.outcome == 'success'
        env:
          VERSION: ${{ steps.config.outputs.release }}
        run: |
          set -euo pipefail
          # Each Worker records its own success so a failure only rolls back
          # the Workers this run actually deployed.
          # wrangler parses --var KEY:VALUE (KEY=VALUE would add a key named "VERSION=…").
          for worker in auth reservations billing; do
            pnpm --filter @athlya/api exec wrangler deploy -c "wrangler.${worker}.toml" --env production --var "VERSION:${VERSION}" --outdir "dist/${worker}"
            echo "${worker}=true" >> "$GITHUB_OUTPUT"
          done

      - name: Pre-canary health check (old gateway + new sub-workers)
        if: steps.config.outputs.ready == 'true' && steps.deploy_subworkers.outcome == 'success'
        run: bash scripts/wait-health-ready.sh "${PRODUCTION_API_URL}" 10 5

      # Unauthenticated on purpose: production login requires a single-use
      # Turnstile token CI cannot mint. Authenticated smoke runs on staging.
      - name: Route reachability (old gateway + new sub-workers)
        if: steps.config.outputs.ready == 'true' && steps.deploy_subworkers.outcome == 'success'
        run: node scripts/smoke-routes.mjs --base-url "${PRODUCTION_API_URL}"

      - name: Canary 1% → 10% → 100%
        id: canary
        if: steps.config.outputs.ready == 'true' && steps.deploy_subworkers.outcome == 'success'
        env:
          VERSION: ${{ steps.config.outputs.release }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          CANARY_MAX_ERRORS: ${{ vars.CANARY_MAX_ERRORS }}
          CANARY_MAX_P95_MS: ${{ vars.CANARY_MAX_P95_MS }}
          CANARY_LATENCY_SAMPLES: ${{ vars.CANARY_LATENCY_SAMPLES }}
          GATEWAY_VERSION_ID: ${{ steps.upload_gateway.outputs.version_id }}
        run: |
          set -euo pipefail
          node scripts/canary-deploy.mjs production-canary \
            --base-url "${PRODUCTION_API_URL}" \
            --version-id "${GATEWAY_VERSION_ID}" \
            --wait-min "10" \
            --steps "1,10,100"

      - name: Finalize Sentry release + deploy marker
        if: steps.config.outputs.ready == 'true' && steps.canary.outcome == 'success'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: bash scripts/sentry-release.sh finalize production

      # Issue #404 — rollback must fail loudly so the on-call engineer
      # sees the failure immediately. The previous || true silently swallowed
      # rollback errors, leaving the fleet in an undefined mixed-version state.
      # Each rollback command runs independently; a failure in one is surfaced
      # as a non-zero exit so the step fails and the workflow is marked red.
      # Only the Workers this run deployed are rolled back: `wrangler
      # rollback` without a version id reverts to the previous deployment, so
      # running it on an untouched Worker would downgrade production. The
      # gateway counts as deployed once canary-deploy.mjs promoted it.
      - name: Rollback on failure
        if: >-
          failure() && steps.config.outputs.ready == 'true' &&
          (steps.canary.outputs.promoted == 'true' ||
           steps.deploy_subworkers.outputs.auth == 'true' ||
           steps.deploy_subworkers.outputs.reservations == 'true' ||
           steps.deploy_subworkers.outputs.billing == 'true')
        env:
          GATEWAY_DEPLOYED: ${{ steps.canary.outputs.promoted }}
          AUTH_DEPLOYED: ${{ steps.deploy_subworkers.outputs.auth }}
          RESERVATIONS_DEPLOYED: ${{ steps.deploy_subworkers.outputs.reservations }}
          BILLING_DEPLOYED: ${{ steps.deploy_subworkers.outputs.billing }}
        run: |
          set +e
          echo "::warning::Deploy failed — rolling back the production Workers this run deployed"
          ROLLBACK_FAILED=0

          if [ "${GATEWAY_DEPLOYED}" = 'true' ]; then
            node scripts/canary-deploy.mjs rollback --env production
            if [ $? -ne 0 ]; then
              echo "::error::Gateway rollback FAILED"
              ROLLBACK_FAILED=1
            fi
          fi

          for worker in auth reservations billing; do
            deployed_var="${worker^^}_DEPLOYED"
            [ "${!deployed_var}" = 'true' ] || continue
            pnpm --filter @athlya/api exec wrangler rollback -c "wrangler.${worker}.toml" --env production
            if [ $? -ne 0 ]; then
              echo "::error::${worker} sub-worker rollback FAILED"
              ROLLBACK_FAILED=1
            fi
          done

          if [ $ROLLBACK_FAILED -ne 0 ]; then
            echo "::error::One or more rollbacks failed. Fleet may be in a mixed-version state. Page on-call immediately."
            exit 1
          fi
          echo "::notice::All workers rolled back successfully."
