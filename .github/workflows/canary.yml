name: Canary Deploy

# CN.7.1 — automatic canary promotion on every push to master.
# Runbook: docs/runbooks/canary-deploy.md
#
# Required secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Required vars:    PRODUCTION_API_URL, STAGING_API_URL
#
# The canary-deploy.mjs script handles:
#   • upload           — wrangler versions upload → new VERSION_ID
#   • promote          — wrangler deployments create --percentage N
#   • health poll      — /health/ready bake window between steps
#   • rollback         — wrangler rollback on health failure
#
# Steps: 5% → 10-min bake → 25% → 10-min bake → 100%
# Any failed /health/ready check during a bake rolls back and fails the job.

on:
  push:
    branches:
      - master
    paths:
      - 'packages/api/**'
      - '.github/workflows/canary.yml'

concurrency:
  group: canary-deploy-production
  cancel-in-progress: false

jobs:
  canary:
    name: Canary deploy (5% → 25% → 100%)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert Cloudflare credentials
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set"
            exit 1
          fi

      - name: Assert production URL configured
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_API_URL}" ]; then
            echo "::error::vars.PRODUCTION_API_URL is not set"
            exit 1
          fi

      - name: Upload new Worker version
        id: upload
        run: |
          set -euo pipefail
          VERSION="${GITHUB_SHA:0:7}"
          node scripts/canary-deploy.mjs upload --env production --message "canary ${VERSION}"
          # Capture the latest version id so subsequent steps can reference it
          VERSION_ID=$(node -e "
            const { spawnSync } = require('child_process');
            const r = spawnSync('pnpm', ['--filter', '@athlya/api', 'exec', 'wrangler', 'versions', 'list', '--env', 'production', '--json'], { encoding: 'utf8', cwd: process.cwd() });
            const raw = (r.stdout || '').split('\n').find(l => l.trim().startsWith('[') || l.trim().startsWith('{'));
            const parsed = JSON.parse(raw || '[]');
            const versions = Array.isArray(parsed) ? parsed : (parsed?.versions ?? []);
            const id = versions[0]?.id ?? versions[0]?.version_id ?? '';
            process.stdout.write(id);
          ")
          echo "version_id=${VERSION_ID}" >> "$GITHUB_OUTPUT"
          echo "Uploaded version: ${VERSION_ID}"

      - name: Canary 5% → 25% → 100%
        env:
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
        run: |
          set -euo pipefail
          node scripts/canary-deploy.mjs production-canary \
            --base-url "${PRODUCTION_API_URL}" \
            --staging-url "${STAGING_API_URL:-}" \
            --wait-min "10" \
            --steps "5,25,100"

      - name: Rollback on failure
        if: failure() && steps.upload.outputs.version_id != ''
        run: |
          echo "::warning::Canary health check failed — rolling back production"
          node scripts/canary-deploy.mjs rollback --env production
          echo "::error::Canary rolled back. Check /health/ready logs for the failure."
