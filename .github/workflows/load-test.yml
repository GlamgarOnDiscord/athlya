name: Load test (k6)

# Runs k6 against staging on PRs touching reservations/api/k6 paths.
# Manual dispatch supports staging and production perf gates.
#
# Required secrets / variables (Settings > Secrets / Variables):
#   K6_STAGING_BASE_URL    (variable) staging API gateway URL
#   K6_STAGING_AUTH_TOKENS (secret)   CSV of JWTs — one per simulated user
#   K6_STAGING_STUDIO_ID   (secret)   test studio UUID
#   K6_STAGING_CLASS_IDS   (secret)   CSV of class UUIDs (>= 10)
#
# K6_STAGING_AUTH_TOKEN (singular) is accepted for backward compatibility
# but triggers a warning in the k6 script because a single token causes
# all VUs to share one identity, producing 409 duplicates instead of
# real booking contention (issue #414).

on:
  pull_request:
    paths:
      - 'packages/reservations/**'
      - 'packages/api/**'
      - 'k6/**'
      - '.github/workflows/load-test.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target environment (staging | production)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      scenario:
        description: 'k6 scenario (nominal_load | soak | spike)'
        required: false
        default: 'nominal_load'
        type: choice
        options:
          - nominal_load
          - soak
          - spike

permissions:
  contents: read

jobs:
  k6-book-class:
    name: book-class load test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Require K6_STAGING_BASE_URL
        run: |
          if [ -z "${{ vars.K6_STAGING_BASE_URL }}" ]; then
            echo "::error::K6_STAGING_BASE_URL must be set as a GitHub variable. Set it in Settings > Variables to enable load tests."
            exit 1
          fi

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run book-class load test
        env:
          K6_BASE_URL: ${{ vars.K6_STAGING_BASE_URL }}
          K6_AUTH_TOKENS: ${{ secrets.K6_STAGING_AUTH_TOKENS }}
          K6_AUTH_TOKEN: ${{ secrets.K6_STAGING_AUTH_TOKEN }}
          K6_STUDIO_ID: ${{ secrets.K6_STAGING_STUDIO_ID }}
          K6_CLASS_IDS: ${{ secrets.K6_STAGING_CLASS_IDS }}
          K6_SCENARIO: ${{ github.event.inputs.scenario || 'nominal_load' }}
        run: k6 run k6/book-class.js --summary-export=k6-book-class-summary.json

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: k6-book-class-summary
          path: k6-book-class-summary.json
          retention-days: 30

  k6-list-classes:
    name: list-classes load test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Require K6_STAGING_BASE_URL
        run: |
          if [ -z "${{ vars.K6_STAGING_BASE_URL }}" ]; then
            echo "::error::K6_STAGING_BASE_URL must be set as a GitHub variable. Set it in Settings > Variables to enable load tests."
            exit 1
          fi

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run list-classes load test
        env:
          K6_BASE_URL: ${{ vars.K6_STAGING_BASE_URL }}
          K6_AUTH_TOKEN: ${{ secrets.K6_STAGING_AUTH_TOKEN }}
        run: k6 run k6/list-classes.js

  k6-syntax-lint:
    name: k6 syntax lint
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: k6 archive (parses without running)
        env:
          K6_AUTH_TOKENS: 'lint-token-1,lint-token-2'
          K6_STUDIO_ID: '00000000-0000-4000-8000-000000000000'
          K6_CLASS_IDS: '00000000-0000-4000-8000-000000000001'
        run: |
          k6 archive k6/book-class.js -O /tmp/book.tar
          k6 archive k6/list-classes.js -O /tmp/list.tar
          echo "k6 scripts parse cleanly"

  staging-perf-gate:
    name: staging perf gate (soak + spike)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Require K6_STAGING_BASE_URL
        run: |
          if [ -z "${{ vars.K6_STAGING_BASE_URL }}" ]; then
            echo "::error::K6_STAGING_BASE_URL must be set as a GitHub variable before running the production perf gate."
            exit 1
          fi

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Soak test (30 min, 50 VUs)
        env:
          K6_BASE_URL: ${{ vars.K6_STAGING_BASE_URL }}
          K6_AUTH_TOKENS: ${{ secrets.K6_STAGING_AUTH_TOKENS }}
          K6_AUTH_TOKEN: ${{ secrets.K6_STAGING_AUTH_TOKEN }}
          K6_STUDIO_ID: ${{ secrets.K6_STAGING_STUDIO_ID }}
          K6_CLASS_IDS: ${{ secrets.K6_STAGING_CLASS_IDS }}
          K6_SCENARIO: soak
        run: k6 run k6/book-class.js --summary-export=k6-soak-summary.json

      - name: Spike test (200 VU burst)
        env:
          K6_BASE_URL: ${{ vars.K6_STAGING_BASE_URL }}
          K6_AUTH_TOKENS: ${{ secrets.K6_STAGING_AUTH_TOKENS }}
          K6_AUTH_TOKEN: ${{ secrets.K6_STAGING_AUTH_TOKEN }}
          K6_STUDIO_ID: ${{ secrets.K6_STAGING_STUDIO_ID }}
          K6_CLASS_IDS: ${{ secrets.K6_STAGING_CLASS_IDS }}
          K6_SCENARIO: spike
        run: k6 run k6/book-class.js --summary-export=k6-spike-summary.json

      - name: Upload perf gate summaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: k6-perf-gate-summaries
          path: |
            k6-soak-summary.json
            k6-spike-summary.json
          retention-days: 30
