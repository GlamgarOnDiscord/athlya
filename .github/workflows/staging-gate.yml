name: Staging gate

# Issue #343 — proves the staging environment before production deploys.
#
# This workflow runs 5 sequential sub-checks against staging:
#   1. Verify all required secrets are present (scripts/verify-secrets.mjs)
#   2. Deploy to staging and wait for /health/ready
#   3. Smoke all route groups (scripts/smoke-routes.mjs)
#   4. Migration check — verify DB has all expected migrations applied
#   5. k6 performance gate — p99 < 500ms, error rate < 1%
#
# Fail closed (issue #343): on trusted runs (same-repo PRs, pushes to
# master, manual runs) a missing prerequisite FAILS the job with a
# machine-readable reason in the step summary. Only runs that cannot read
# secrets — pull requests from forks and Dependabot-triggered runs — report
# a neutral skip.
#
# Staging is one shared environment (Workers + Neon branch), so every run
# that deploys it joins the single `staging-environment` concurrency group
# and queues instead of racing: the SHA a gate deploys is the SHA it
# smokes, load-tests and reports on. In-progress runs are never cancelled,
# so a migration is never cut off mid-way. GitHub keeps at most one
# *pending* run per group: a newer queued run supersedes an older pending
# one, which then has to be re-run (production deploys fail closed on a
# SHA without a successful gate). Runs that skip (fork/Dependabot) never
# deploy, so they use a per-ref group and don't queue behind deploys.
#
# The workflow has no `paths:` filter: it is a required check, and a
# path-filtered required check never reports on PRs outside the paths,
# leaving them blocked forever.
#
# Pushes to master run the gate on the exact SHA that production deploy
# phases later verify (scripts/require-check-success.mjs).
#
# Required secrets (GitHub environment: staging):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   MIGRATION_DB_URL_STAGING  — neondb_owner URL for the staging branch
# Required vars:
#   STAGING_API_URL            — e.g. https://staging.api.athlya.app
#   STAGING_SMOKE_EMAIL, STAGING_SMOKE_PASSWORD — dedicated smoke account
#   K6_STAGING_AUTH_TOKEN, K6_STAGING_STUDIO_ID, K6_STAGING_CLASS_IDS
# Optional:
#   STAGING_SMOKE_TURNSTILE_TOKEN — when staging uses a non-test Turnstile secret
#   vars.STAGING_SMOKE_STUDIO_SLUG — adds an authenticated GET /v1/classes check

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      soak_duration:
        description: 'k6 soak duration (e.g. 2m for PR, 10m for release gates)'
        required: false
        default: '2m'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event.pull_request.user.login == 'dependabot[bot]') && format('staging-gate-noop-{0}', github.ref) || 'staging-environment' }}
  cancel-in-progress: false

jobs:
  staging-gate:
    name: Staging gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Check infra prerequisites
        id: prereq
        env:
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          IS_DEPENDABOT: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
          MIGRATION_DB_URL: ${{ secrets.MIGRATION_DB_URL_STAGING }}
          SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${IS_FORK_PR}" = "true" ]; then
            echo "::notice title=Staging gate neutral::Fork pull request — secrets are unavailable, so the deployed system is not exercised."
            echo "### Staging gate: NEUTRAL (fork PR, no secrets)" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${IS_DEPENDABOT}" = "true" ]; then
            echo "::notice title=Staging gate neutral::Dependabot-triggered run — Actions secrets are unavailable, so the deployed system is not exercised. The post-merge push to master runs the full gate."
            echo "### Staging gate: NEUTRAL (Dependabot run, no secrets)" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=()
          [ -n "${CLOUDFLARE_API_TOKEN}" ] || missing+=("secrets.CLOUDFLARE_API_TOKEN")
          [ -n "${CLOUDFLARE_ACCOUNT_ID}" ] || missing+=("secrets.CLOUDFLARE_ACCOUNT_ID")
          [ -n "${STAGING_API_URL}" ] || missing+=("vars.STAGING_API_URL")
          [ -n "${MIGRATION_DB_URL}" ] || missing+=("secrets.MIGRATION_DB_URL_STAGING")
          [ -n "${SMOKE_EMAIL}" ] || missing+=("secrets.STAGING_SMOKE_EMAIL")
          [ -n "${SMOKE_PASSWORD}" ] || missing+=("secrets.STAGING_SMOKE_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            {
              echo "### Staging gate: FAILED — prerequisites missing"
              for item in "${missing[@]}"; do echo "- \`${item}\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Staging gate not configured::missing ${missing[*]} (configure the 'staging' environment)"
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.prereq.outputs.skip != 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        if: steps.prereq.outputs.skip != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.prereq.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      # Sub-check 1 — secrets presence
      - name: '[1/5] Verify secrets'
        if: steps.prereq.outputs.skip != 'true'
        run: node scripts/verify-secrets.mjs --env staging

      # Sub-check 2 — deploy staging and gate on /health/ready
      - name: '[2/5] Deploy staging'
        if: steps.prereq.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DB_URL_STAGING }}
        run: |
          set -euo pipefail
          node packages/db/scripts/migrate.mjs
          VERSION="${GITHUB_SHA:0:7}"
          pnpm --filter @athlya/api exec wrangler deploy --env staging --var "VERSION:${VERSION}" --outdir dist
          pnpm --filter @athlya/api exec wrangler deploy -c wrangler.auth.toml --env staging --var "VERSION:${VERSION}"
          pnpm --filter @athlya/api exec wrangler deploy -c wrangler.reservations.toml --env staging --var "VERSION:${VERSION}"
          pnpm --filter @athlya/api exec wrangler deploy -c wrangler.billing.toml --env staging --var "VERSION:${VERSION}"
          bash scripts/wait-health-ready.sh "${STAGING_API_URL}"

      # Sub-check 3 — smoke all route groups
      - name: '[3/5] Smoke all route groups'
        if: steps.prereq.outputs.skip != 'true'
        env:
          SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
          SMOKE_TURNSTILE_TOKEN: ${{ secrets.STAGING_SMOKE_TURNSTILE_TOKEN }}
          SMOKE_STUDIO_SLUG: ${{ vars.STAGING_SMOKE_STUDIO_SLUG }}
        run: node scripts/smoke-routes.mjs --base-url "${STAGING_API_URL}" --require-auth

      # Sub-check 4 — migration check: every .sql file in migrations/
      # must appear in the _athlya_migrations table on staging.
      - name: '[4/5] Migration check'
        if: steps.prereq.outputs.skip != 'true'
        env:
          MIGRATION_DB_URL: ${{ secrets.MIGRATION_DB_URL_STAGING }}
        run: |
          set -euo pipefail
          # Expected: filename stems of all forward migration files
          expected=$(ls packages/db/migrations/*.sql | grep -v '\.down\.sql$' | sort | xargs -I{} basename {} .sql)
          # Applied: what the staging DB reports
          applied=$(psql "${MIGRATION_DB_URL}" -t -c \
            "SELECT name FROM _athlya_migrations ORDER BY name" 2>/dev/null | tr -d ' \r')
          missing=$(comm -23 <(echo "$expected" | sort) <(echo "$applied" | sort))
          if [ -n "$missing" ]; then
            echo "::error::Staging DB is missing migrations:"
            echo "$missing"
            exit 1
          fi
          echo "::notice::All $(echo "$expected" | wc -l | tr -d ' ') migrations applied on staging"

      # Sub-check 5 — k6 perf gate (skipped if k6 secrets not set)
      - name: Install k6
        if: steps.prereq.outputs.skip != 'true' && vars.K6_STAGING_BASE_URL != ''
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: '[5/5] k6 performance gate'
        if: steps.prereq.outputs.skip != 'true' && vars.K6_STAGING_BASE_URL != ''
        env:
          K6_BASE_URL: ${{ vars.K6_STAGING_BASE_URL }}
          K6_AUTH_TOKEN: ${{ secrets.K6_STAGING_AUTH_TOKEN }}
          K6_STUDIO_ID: ${{ secrets.K6_STAGING_STUDIO_ID }}
          K6_CLASS_IDS: ${{ secrets.K6_STAGING_CLASS_IDS }}
          K6_SOAK_DURATION: ${{ inputs.soak_duration || '2m' }}
        run: |
          k6 run k6/book-class.js \
            --duration "${K6_SOAK_DURATION}" \
            --summary-export=k6-staging-gate-summary.json

      - name: '[5/5] k6 gate missing K6_STAGING_BASE_URL'
        if: steps.prereq.outputs.skip != 'true' && vars.K6_STAGING_BASE_URL == ''
        run: |
          echo "::error::K6_STAGING_BASE_URL is required for the staging perf gate. Set it in Settings > Variables along with K6_STAGING_AUTH_TOKEN, K6_STAGING_STUDIO_ID, and K6_STAGING_CLASS_IDS."
          exit 1

      - name: Upload k6 summary
        if: steps.prereq.outputs.skip != 'true' && vars.K6_STAGING_BASE_URL != '' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k6-staging-gate-summary
          path: k6-staging-gate-summary.json
          retention-days: 14
