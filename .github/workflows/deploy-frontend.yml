name: Deploy Frontend

# Production delivery for apps/web and apps/studio (issue #422).
#
# Hosting: OpenNext → Cloudflare Workers (docs/security/deploy-web-adr.md).
#   build:   `opennextjs-cloudflare build` (next build + Worker bundle in .open-next/)
#   deploy:  `wrangler deploy --env <staging|production>` from apps/<app>/wrangler.jsonc
#   workers: athlya-web-staging / athlya-web, athlya-studio-staging / athlya-studio
# NEXT_PUBLIC_* values are inlined at build time, so each environment gets
# its own build from that environment's variables.
#
# Required secrets (GitHub environments staging / production):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Required vars (per environment):
#   WEB_URL, STUDIO_URL, API_URL          — public origins (smoke + NEXT_PUBLIC_API_URL)
#   TURNSTILE_SITE_KEY                    — NEXT_PUBLIC_TURNSTILE_SITE_KEY (optional)
#   CSP_REPORT_URI                        — NEXT_PUBLIC_CSP_REPORT_URI (optional)
# Required secrets (environment staging only) — browser release smoke:
#   STAGING_SMOKE_EMAIL, STAGING_SMOKE_PASSWORD           — member smoke account
#                                                           (shared with staging-gate.yml)
#   STAGING_SMOKE_ADMIN_EMAIL, STAGING_SMOKE_ADMIN_PASSWORD — studio admin of the
#                                                           smoke studio
# Staging must run Cloudflare's Turnstile test keys (site key here, secret on
# the API) so the headless browser can log in.
#
# Phases:
#   deploy   — build → deploy → readiness → real-network smoke → browser
#              release smoke (Playwright, apps/*/e2e/release). Staging runs
#              every flow: member login → classes → book → cancel, studio
#              admin login → classes table → create → delete, password-reset
#              request. Production runs the anonymous browser pass only (its
#              Turnstile secret is real, docs/runbooks/canary-deploy.md) and
#              requires a green staging release smoke on the same commit. On
#              failure the production apps deployed by this run are rolled
#              back and the job stays red.
#   rollback — wrangler rollback to the previous version; fails loudly.
# The API must be deployed first when a release changes the API contract
# (docs/runbooks/deploy-frontend.md).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production
      phase:
        description: Deploy or roll back
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback
      apps:
        description: Apps to act on
        required: true
        default: all
        type: choice
        options:
          - all
          - web
          - studio

permissions:
  contents: read

concurrency:
  group: deploy-frontend-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  frontend:
    # The production deploy looks this check name up on the commit
    # ("deploy all (staging)" / "deploy <app> (staging)"): keep the format.
    name: ${{ inputs.phase }} ${{ inputs.apps }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      checks: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      DEPLOY_WEB: ${{ inputs.apps == 'all' || inputs.apps == 'web' }}
      DEPLOY_STUDIO: ${{ inputs.apps == 'all' || inputs.apps == 'studio' }}
      WEB_URL: ${{ vars.WEB_URL }}
      STUDIO_URL: ${{ vars.STUDIO_URL }}
      API_URL: ${{ vars.API_URL }}
      RELEASE_SMOKE_SCOPE: ${{ inputs.environment == 'staging' && 'full' || 'public' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert configuration
        env:
          PHASE: ${{ inputs.phase }}
          SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
          SMOKE_ADMIN_EMAIL: ${{ secrets.STAGING_SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.STAGING_SMOKE_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${CLOUDFLARE_API_TOKEN}" ] || missing+=(secrets.CLOUDFLARE_API_TOKEN)
          [ -n "${CLOUDFLARE_ACCOUNT_ID}" ] || missing+=(secrets.CLOUDFLARE_ACCOUNT_ID)
          [ -n "${API_URL}" ] || missing+=(vars.API_URL)
          if [ "${DEPLOY_WEB}" = 'true' ] && [ -z "${WEB_URL}" ]; then missing+=(vars.WEB_URL); fi
          if [ "${DEPLOY_STUDIO}" = 'true' ] && [ -z "${STUDIO_URL}" ]; then missing+=(vars.STUDIO_URL); fi
          # The full browser release smoke runs on staging deploys only.
          if [ "${PHASE}" = 'deploy' ] && [ "${RELEASE_SMOKE_SCOPE}" = 'full' ]; then
            if [ "${DEPLOY_WEB}" = 'true' ]; then
              [ -n "${SMOKE_EMAIL}" ] || missing+=(secrets.STAGING_SMOKE_EMAIL)
              [ -n "${SMOKE_PASSWORD}" ] || missing+=(secrets.STAGING_SMOKE_PASSWORD)
            fi
            if [ "${DEPLOY_STUDIO}" = 'true' ]; then
              [ -n "${SMOKE_ADMIN_EMAIL}" ] || missing+=(secrets.STAGING_SMOKE_ADMIN_EMAIL)
              [ -n "${SMOKE_ADMIN_PASSWORD}" ] || missing+=(secrets.STAGING_SMOKE_ADMIN_PASSWORD)
            fi
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing configuration for ${{ inputs.environment }}: ${missing[*]}"
            exit 1
          fi

      # Production cannot run the flows that log in (real Turnstile secret),
      # so it only ships a commit whose staging deploy ran them green.
      - name: Require green staging release smoke for this commit
        if: inputs.phase == 'deploy' && inputs.environment == 'production'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for app in web studio; do
            flag="DEPLOY_${app^^}"
            [ "${!flag}" = 'true' ] || continue
            node scripts/require-check-success.mjs --repo "${GITHUB_REPOSITORY}" --sha "${GITHUB_SHA}" \
              --any-check "deploy all (staging)" --any-check "deploy ${app} (staging)"
          done

      - name: Install Chromium
        if: inputs.phase == 'deploy'
        run: pnpm --filter @athlya/web exec playwright install --with-deps chromium

      # ---------------------------------------------------------------- build
      - name: Build Workers (OpenNext)
        if: inputs.phase == 'deploy'
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
          NEXT_PUBLIC_BASE_URL: ${{ vars.WEB_URL }}
          NEXT_PUBLIC_WEB_BASE_URL: ${{ vars.WEB_URL }}
          NEXT_PUBLIC_STUDIO_BASE_URL: ${{ vars.STUDIO_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_CSP_REPORT_URI: ${{ vars.CSP_REPORT_URI }}
          SKIP_ENV_VALIDATION: '1'
        run: |
          set -euo pipefail
          pnpm --filter @athlya/shared build
          if [ "${DEPLOY_WEB}" = 'true' ]; then pnpm --filter @athlya/web build:worker; fi
          if [ "${DEPLOY_STUDIO}" = 'true' ]; then pnpm --filter @athlya/studio build:worker; fi

      # --------------------------------------------------------------- deploy
      - name: Deploy Workers
        if: inputs.phase == 'deploy'
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          for app in web studio; do
            flag="DEPLOY_${app^^}"
            [ "${!flag}" = 'true' ] || continue
            pnpm --filter "@athlya/${app}" exec wrangler deploy \
              --env "${TARGET_ENV}" \
              --var "VERSION:${GITHUB_SHA}" \
              --message "deploy ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
            echo "DEPLOYED_${app^^}=true" >> "$GITHUB_ENV"
          done

      - name: Wait for readiness
        if: inputs.phase == 'deploy'
        run: |
          set -euo pipefail
          wait_for() {
            for _ in $(seq 1 30); do
              if curl -fsS -o /dev/null "$1"; then echo "ready: $1"; return 0; fi
              sleep 2
            done
            echo "::error::$1 not serving 200 after 60s"
            return 1
          }
          if [ "${DEPLOY_WEB}" = 'true' ]; then wait_for "${WEB_URL}/robots.txt"; fi
          if [ "${DEPLOY_STUDIO}" = 'true' ]; then wait_for "${STUDIO_URL}/login"; fi

      # Real network only: pages, CSP nonce, HSTS, auth route handlers, API.
      - name: Post-deploy smoke
        if: inputs.phase == 'deploy'
        run: |
          set -euo pipefail
          [ "${DEPLOY_WEB}" = 'true' ] || WEB_URL=''
          [ "${DEPLOY_STUDIO}" = 'true' ] || STUDIO_URL=''
          WEB_URL="${WEB_URL}" STUDIO_URL="${STUDIO_URL}" API_URL="${API_URL}" \
            node scripts/smoke-frontend.mjs

      # Real browser against the deployed Workers and the real API, no
      # route stubs. RELEASE_SMOKE_SCOPE: full on staging, public (anonymous
      # pass) on production. A failure here rolls production back below.
      - name: Post-deploy browser release smoke
        if: inputs.phase == 'deploy'
        env:
          SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
          SMOKE_ADMIN_EMAIL: ${{ secrets.STAGING_SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.STAGING_SMOKE_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          status=0
          if [ "${DEPLOY_WEB}" = 'true' ]; then
            pnpm --filter @athlya/web e2e:release || status=1
          fi
          if [ "${DEPLOY_STUDIO}" = 'true' ]; then
            pnpm --filter @athlya/studio e2e:release || status=1
          fi
          exit "${status}"

      # ------------------------------------------------------------- rollback
      # phase=rollback: roll back every selected app.
      # Failed production deploy: roll back only the apps whose `wrangler
      # deploy` succeeded in this run (DEPLOYED_<APP>). A failure before or
      # during the first deploy leaves production untouched.
      - name: Roll back
        if: inputs.phase == 'rollback' || (failure() && inputs.phase == 'deploy' && inputs.environment == 'production')
        env:
          TARGET_ENV: ${{ inputs.environment }}
          PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          rolled_back=0
          for app in web studio; do
            if [ "${PHASE}" = 'rollback' ]; then
              flag="DEPLOY_${app^^}"
            else
              flag="DEPLOYED_${app^^}"
            fi
            [ "${!flag:-}" = 'true' ] || continue
            echo "Rolling back athlya-${app} (${TARGET_ENV})"
            pnpm --filter "@athlya/${app}" exec wrangler rollback \
              --env "${TARGET_ENV}" -y \
              --message "rollback from run ${GITHUB_RUN_ID}"
            rolled_back=$((rolled_back + 1))
          done
          if [ "${rolled_back}" -eq 0 ]; then
            echo "::notice::Nothing was deployed in this run, so production was left untouched."
          else
            echo "::warning::Frontend rolled back — the triggering deploy did not ship."
          fi

      - name: Smoke after rollback
        if: inputs.phase == 'rollback'
        run: |
          set -euo pipefail
          [ "${DEPLOY_WEB}" = 'true' ] || WEB_URL=''
          [ "${DEPLOY_STUDIO}" = 'true' ] || STUDIO_URL=''
          WEB_URL="${WEB_URL}" STUDIO_URL="${STUDIO_URL}" node scripts/smoke-frontend.mjs
