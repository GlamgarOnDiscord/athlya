name: Daily dependency audit

# =====================================================================
# Requirement 29.2 — dependency and supply-chain vulnerability gate.
#
# Replaces the broken pnpm audit job (npm /v1/security/audits HTTP 410)
# with google/osv-scanner-action, which queries the OSV database directly
# from the committed pnpm-lock.yaml without calling the retired endpoint.
#
# Two jobs:
#
# 1. osv-scan — scans all dependencies (runtime + dev) via OSV database.
#    Uploads a JSON report on every run. Fails closed on any finding or
#    scanner error. No secrets required; safe for forks.
#
# 2. pnpm-overrides-check — verifies that every pnpm.overrides entry is
#    documented in scripts/overrides-rationale.json and under 6 months
#    old. Also confirms the installed pnpm version matches packageManager.
#
# Socket Security supply-chain scanning is handled by the Socket GitHub
# App integration (separate checks: "Socket Security: Pull Request Alerts"
# and "Socket Security: Project Report"). The empty socket-security job
# that previously lived here has been removed — it contained no scanner
# step and granted pull-requests: write for no purpose.
# =====================================================================

on:
  schedule:
    # 06:00 UTC every day — visible before the European workday starts.
    - cron: '0 6 * * *'
  pull_request:
    paths:
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deps-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scan:
    name: OSV vulnerability scan (lockfile)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run OSV-Scanner against pnpm lockfile
        # Scans pnpm-lock.yaml against the OSV database (osv.dev).
        # Exit codes: 0 = clean, 1 = vulnerabilities found, 2+ = scanner
        # error (network, malformed lockfile, etc.). All non-zero outcomes
        # fail this step — scanner outage is not a silent pass.
        # continue-on-error so we can upload the report before re-failing.
        id: osv
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml

      - name: Export machine-readable JSON report
        # osv-scanner binary is in PATH after the action step above.
        # `|| true` ensures the export never masks the real failure reason.
        if: always()
        run: |
          osv-scanner --lockfile=pnpm-lock.yaml --format=json --output=osv-report.json || true

      - name: Upload OSV report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: osv-vulnerability-report
          path: osv-report.json
          retention-days: 30
          if-no-files-found: warn

      - name: Fail on vulnerability findings or scanner error
        if: steps.osv.outcome == 'failure'
        run: |
          echo "::error::OSV-Scanner reported findings or a scanner error — see the osv-vulnerability-report artifact for details."
          exit 1

  pnpm-overrides-check:
    name: pnpm overrides documentation check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pnpm overrides are documented and not stale
        run: node scripts/check-overrides.mjs

      - name: Check pnpm version matches packageManager field
        # Drift between the installed pnpm and packageManager in package.json
        # can cause pnpm.overrides to be silently ignored or misapplied.
        run: |
          set -euo pipefail
          EXPECTED=$(node -e "const p=require('./package.json'); console.log((p.packageManager||'').split('@')[1]||'')")
          ACTUAL=$(pnpm --version)
          if [ -z "$EXPECTED" ]; then
            echo "::warning::packageManager field not set in package.json — cannot verify pnpm version pin"
          elif [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::pnpm version mismatch: packageManager pins $EXPECTED but $ACTUAL is installed"
            echo "::error::pnpm.overrides may be silently misapplied. Update or re-pin the version."
            exit 1
          else
            echo "pnpm version OK: $ACTUAL == $EXPECTED"
          fi
