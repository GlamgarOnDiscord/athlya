name: Terraform

# Issue #305 — run terraform plan on PRs that touch infra/terraform/.
# Issue #405 — production-safe state, credential-free validation, drift.
#
# Jobs:
#   validate  → every PR / push touching infra: fmt -check, init
#               -backend=false, validate, lock-file assertion. Needs no
#               credentials, so it can never skip.
#   terraform → plan (PRs, dispatch, daily drift) and apply (dispatch).
#               Plan and apply run in the same job so apply never uses a
#               stale plan. On trusted runs (dispatch, schedule) missing
#               credentials or backend config FAIL the job; only PRs
#               without access (forks, unprovisioned envs) skip the plan.
#   Drift     → the daily scheduled plan uses -detailed-exitcode and fails
#               when production differs from the code.
#
# Required secrets (GitHub Environment: staging / production):
#   TF_VAR_cloudflare_api_token   — Cloudflare API token (Workers, Queue, R2, WAF)
#   TF_VAR_cloudflare_account_id  — Cloudflare account ID
#   TF_VAR_cloudflare_zone_id     — Cloudflare zone ID for athlya.app
#   TF_VAR_sentry_auth_token      — Sentry API auth token (metric alerts)
#   TF_VAR_sentry_org             — Sentry organisation slug
#   TF_VAR_sentry_project         — Sentry project slug
#   TF_VAR_sentry_alert_team_id   — Sentry team id notified by metric alerts
#   TF_TOKEN_app_terraform_io     — HCP Terraform API token (remote state)
#
# Required variables (vars.*):
#   TF_CLOUD_ORGANIZATION         — HCP Terraform organisation slug
#   CLOUDFLARE_ZONE_PLAN          — optional: free | pro | business | enterprise (default: pro)
#
# See infra/terraform/versions.tf for the backend and
# docs/runbooks/terraform-ops.md for the apply runbook.

on:
  pull_request:
    branches: [master]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [master]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform.yml'
  schedule:
    # Daily drift detection against production (06:17 UTC).
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      action:
        description: Terraform action
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

env:
  TERRAFORM_VERSION: '1.13.4'

permissions:
  contents: read

jobs:
  validate:
    name: Terraform validate (credential-free)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Lock file pins every provider
        run: |
          set -euo pipefail
          for provider in cloudflare/cloudflare jianyuan/sentry; do
            if ! grep -q "provider \"registry.terraform.io/${provider}\"" .terraform.lock.hcl; then
              echo "::error file=infra/terraform/.terraform.lock.hcl::${provider} is not locked — run terraform providers lock"
              exit 1
            fi
          done

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: terraform validate
        run: terraform validate

  terraform:
    name: Terraform ${{ inputs.action || (github.event_name == 'schedule' && 'drift') || 'plan' }} (${{ inputs.environment || (github.event_name == 'schedule' && 'production') || 'staging' }})
    needs: [validate]
    if: always() && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment || (github.event_name == 'schedule' && 'production') || 'staging' }}
    concurrency:
      group: terraform-${{ inputs.environment || (github.event_name == 'schedule' && 'production') || 'staging' }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: infra/terraform

    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.TF_VAR_cloudflare_api_token }}
      TF_VAR_cloudflare_account_id: ${{ secrets.TF_VAR_cloudflare_account_id }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.TF_VAR_cloudflare_zone_id }}
      TF_VAR_cloudflare_zone_plan: ${{ vars.CLOUDFLARE_ZONE_PLAN || 'pro' }}
      TF_VAR_sentry_auth_token: ${{ secrets.TF_VAR_sentry_auth_token }}
      TF_VAR_sentry_org: ${{ secrets.TF_VAR_sentry_org }}
      TF_VAR_sentry_project: ${{ secrets.TF_VAR_sentry_project }}
      TF_VAR_sentry_alert_team_id: ${{ secrets.TF_VAR_sentry_alert_team_id }}
      TF_VAR_environment: ${{ inputs.environment || (github.event_name == 'schedule' && 'production') || 'staging' }}
      # HCP Terraform remote state token (see versions.tf backend block).
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_app_terraform_io }}
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      # One HCP Terraform workspace per environment so staging and
      # production state are never mixed.
      TF_WORKSPACE: athlya-${{ inputs.environment || (github.event_name == 'schedule' && 'production') || 'staging' }}

    steps:
      - name: Check prerequisites
        id: prereq
        working-directory: .
        env:
          TRUSTED: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push' }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${TF_VAR_cloudflare_api_token}" ] || missing+=("secrets.TF_VAR_cloudflare_api_token")
          [ -n "${TF_TOKEN_app_terraform_io}" ] || missing+=("secrets.TF_TOKEN_app_terraform_io")
          [ -n "${TF_CLOUD_ORGANIZATION}" ] || missing+=("vars.TF_CLOUD_ORGANIZATION")
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "### Terraform plan not possible — missing ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${TRUSTED}" = "true" ]; then
            echo "::error title=Terraform not provisioned::missing ${missing[*]} (no plan/apply/drift check without remote state)"
            exit 1
          fi
          echo "::notice::missing ${missing[*]} — plan skipped on this PR (validate still ran)"
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.prereq.outputs.skip != 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Terraform
        if: steps.prereq.outputs.skip != 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: terraform init
        if: steps.prereq.outputs.skip != 'true'
        run: terraform init -input=false -lockfile=readonly

      # Plan always runs — for plan, apply and drift. Apply consumes the
      # plan produced in this same job, never a stale artifact (#405).
      # The concurrency group is per ref, so runs on different refs wait
      # for the HCP Terraform state lock instead of failing on it.
      - name: terraform plan
        if: steps.prereq.outputs.skip != 'true'
        id: plan
        run: terraform plan -input=false -no-color -lock-timeout=10m -detailed-exitcode -out=tfplan
        continue-on-error: true

      - name: Interpret plan result
        if: steps.prereq.outputs.skip != 'true'
        env:
          EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
          IS_DRIFT_CHECK: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          case "${EXIT_CODE}" in
            0) echo "No changes." ;;
            2)
              if [ "${IS_DRIFT_CHECK}" = "true" ]; then
                echo "::error title=Terraform drift::production differs from infra/terraform — review the plan and reconcile"
                exit 1
              fi
              echo "Changes pending."
              ;;
            *)
              echo "::error::terraform plan failed (exit ${EXIT_CODE})"
              exit 1
              ;;
          esac

      - name: Post plan to PR
        if: steps.prereq.outputs.skip != 'true' && github.event_name == 'pull_request'
        env:
          PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
          PLAN_STDOUT: ${{ steps.plan.outputs.stdout }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const exit = process.env.PLAN_EXIT;
            const planOut = process.env.PLAN_STDOUT || '(no output)';
            const output = [
              `#### Terraform Plan (exit \`${exit}\`)`,
              '<details><summary>Show Plan</summary>',
              '',
              '```terraform',
              planOut,
              '```',
              '',
              '</details>',
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      # Apply only on explicit workflow_dispatch action=apply. The GitHub
      # Environment required-reviewers gate fires before this job starts.
      - name: terraform apply
        if: steps.prereq.outputs.skip != 'true' && inputs.action == 'apply' && github.event_name == 'workflow_dispatch' && steps.plan.outputs.exitcode == '2'
        run: terraform apply -input=false -lock-timeout=10m tfplan
