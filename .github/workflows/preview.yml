name: Preview environments

# Deploys an isolated API preview for every PR (issue #419):
#   • Neon branch  — fresh DB fork from the project primary branch; migrations
#     are applied automatically after branch creation.
#   • Cloudflare Worker — `athlya-api-pr-<N>` (one Worker per PR) deployed with
#     `wrangler deploy` (100 % of its traffic), ENVIRONMENT=preview, connected
#     as the non-BYPASSRLS `athlya_app` role. The job fails unless /health
#     serves the commit's VERSION (issue #419).
#   • Queues — per-PR `athlya-events-preview-pr-<N>*` queues provisioned on
#     open/synchronize and deleted on close, so concurrent PRs never share a
#     queue and preview events never contaminate staging (issues #237, #419).
#   • Redis — dedicated Upstash `athlya-preview` database (PREVIEW_REDIS_URL /
#     PREVIEW_REDIS_TOKEN secrets), isolated from the staging namespace (issue #237).
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN        — Workers:Edit permission
#   CLOUDFLARE_ACCOUNT_ID       — CF account ID
#   NEON_API_KEY                — Neon project API key
#   PREVIEW_REDIS_URL           — Upstash Redis URL (dedicated preview database)
#   PREVIEW_REDIS_TOKEN         — Upstash Redis token (dedicated preview database)
#   PREVIEW_JWT_JWKS_URL        — https JWKS endpoint that publishes the preview key
#   PREVIEW_JWT_KID             — key id of the preview signing key (`preview-…`)
#   PREVIEW_JWT_PRIVATE_KEY_PEM — multi-line PKCS#8 private key
#   PREVIEW_JWT_PUBLIC_KEY_PEM  — multi-line SPKI public key of the same pair
#   PREVIEW_JWKS_JSON           — public JWKS listing the kid, served at
#                                 /.well-known/jwks.json
#   PREVIEW_TURNSTILE_SECRET    — Turnstile secret (staging site key is fine)
#
# The JWT key material is required like on staging: without JWT_KID the
# Worker has no auth/idempotency wiring and refuses every request. It must
# be a dedicated preview pair: preview Workers run PR code, so they never
# get the staging or production signing key. scripts/validate-preview-jwt.mjs
# checks the secret values before any resource is created; it checks that
# PREVIEW_JWT_JWKS_URL is an https URL but never fetches it, so the
# published document is not verified. The operator must make sure it lists
# PREVIEW_JWT_KID, otherwise the tokens a preview mints fail verification.
# See docs/runbooks/preview-pr.md.
#
# Required GitHub variables:
#   NEON_PROJECT_ID              — Neon project ID (e.g. "proud-dream-12345678")
#   CLOUDFLARE_WORKERS_SUBDOMAIN — CF workers.dev subdomain (e.g. "athlya")
#   NEON_DATABASE_NAME           — optional, defaults to "neondb"
#   NEON_OWNER_ROLE              — optional, defaults to "neondb_owner"
#
# The Neon branch owner URL is only used to run migrations; the Worker gets
# an `athlya_app` URL from the Neon v2 connection_uri API so the per-isolate RLS
# role check passes and previews exercise RLS like production.
#
# See docs/runbooks/preview-pr.md for full setup instructions.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  # One preview deploy at a time per PR; updates to the same PR cancel the
  # in-flight deploy so only the latest commit is served.
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEON_API: https://console.neon.tech/api/v2

jobs:
  # --------------------------------------------------------------------------
  # Deploy: runs on every push to an open PR
  # --------------------------------------------------------------------------
  deploy:
    if: github.event.action != 'closed' && vars.NEON_PROJECT_ID != ''
    name: Deploy preview (PR #${{ github.event.pull_request.number }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_WORKER_NAME: athlya-api-pr-${{ github.event.pull_request.number }}
      PREVIEW_URL: https://athlya-api-pr-${{ github.event.pull_request.number }}.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert preview configuration
        env:
          WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          PREVIEW_REDIS_URL: ${{ secrets.PREVIEW_REDIS_URL }}
          PREVIEW_REDIS_TOKEN: ${{ secrets.PREVIEW_REDIS_TOKEN }}
          PREVIEW_JWT_JWKS_URL: ${{ secrets.PREVIEW_JWT_JWKS_URL }}
          PREVIEW_JWT_KID: ${{ secrets.PREVIEW_JWT_KID }}
          PREVIEW_JWT_PRIVATE_KEY_PEM: ${{ secrets.PREVIEW_JWT_PRIVATE_KEY_PEM }}
          PREVIEW_JWT_PUBLIC_KEY_PEM: ${{ secrets.PREVIEW_JWT_PUBLIC_KEY_PEM }}
          PREVIEW_JWKS_JSON: ${{ secrets.PREVIEW_JWKS_JSON }}
          PREVIEW_TURNSTILE_SECRET: ${{ secrets.PREVIEW_TURNSTILE_SECRET }}
        run: |
          if [ -z "${WORKERS_SUBDOMAIN}" ]; then
            echo "::error::vars.CLOUDFLARE_WORKERS_SUBDOMAIN is required to address the preview Worker"
            exit 1
          fi
          # Fail before creating any resource: the Worker refuses every
          # request when one of these secrets is missing.
          missing=()
          for name in PREVIEW_REDIS_URL PREVIEW_REDIS_TOKEN PREVIEW_JWT_JWKS_URL \
            PREVIEW_JWT_KID PREVIEW_JWT_PRIVATE_KEY_PEM PREVIEW_JWT_PUBLIC_KEY_PEM \
            PREVIEW_JWKS_JSON PREVIEW_TURNSTILE_SECRET; do
            [ -n "${!name}" ] || missing+=("secrets.${name}")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing preview secrets: ${missing[*]}"
            exit 1
          fi
          # Malformed or mismatched key material, a non-https JWKS URL or
          # a kid that is not a dedicated preview kid fail here too.
          node scripts/validate-preview-jwt.mjs

      - name: Create Neon branch
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME || 'neondb' }}
          NEON_OWNER_ROLE: ${{ vars.NEON_OWNER_ROLE || 'neondb_owner' }}
          PR_N: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          BRANCH_NAME="preview-pr-${PR_N}"

          # Idempotent: if a branch already exists for this PR (e.g. on
          # `synchronize`), Neon returns 409. We detect that and look up the
          # existing branch instead of failing. The branch gets its own
          # read-write compute so it can be connected to.
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${NEON_API}/projects/${NEON_PROJECT_ID}/branches" \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"branch\": {\"name\": \"${BRANCH_NAME}\"}, \"endpoints\": [{\"type\": \"read_write\"}]}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" = "409" ]; then
            BRANCH_ID=$(curl -sf \
              "${NEON_API}/projects/${NEON_PROJECT_ID}/branches" \
              -H "Authorization: Bearer ${NEON_API_KEY}" | \
              jq -r ".branches[] | select(.name == \"${BRANCH_NAME}\") | .id")
          elif [ "$HTTP_CODE" = "201" ]; then
            BRANCH_ID=$(echo "$BODY" | jq -r '.branch.id // empty')
          else
            echo "::error::Neon branch creation failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

          if [ -z "$BRANCH_ID" ]; then
            echo "::error::Could not resolve the Neon branch id for ${BRANCH_NAME}"
            exit 1
          fi

          # The create response omits connection URIs once the parent has
          # more than one role (it holds athlya_app), so both URIs come from
          # the connection_uri endpoint, one per role.
          connection_uri() {
            curl -sf -G \
              "${NEON_API}/projects/${NEON_PROJECT_ID}/connection_uri" \
              --data-urlencode "branch_id=${BRANCH_ID}" \
              --data-urlencode "database_name=${NEON_DATABASE_NAME}" \
              --data-urlencode "role_name=$1" \
              -H "Authorization: Bearer ${NEON_API_KEY}" | jq -r '.uri // empty'
          }

          # Owner connection, only used for migrations.
          DB_URL=$(connection_uri "${NEON_OWNER_ROLE}" || true)
          if [ -z "$DB_URL" ]; then
            echo "::error::Failed to obtain the ${NEON_OWNER_ROLE} connection URI for ${BRANCH_NAME}"
            exit 1
          fi

          # Runtime connection as athlya_app (no BYPASSRLS).
          APP_DB_URL=$(connection_uri athlya_app || true)
          if [ -z "$APP_DB_URL" ]; then
            echo "::error::Failed to obtain the athlya_app connection URI for ${BRANCH_NAME}"
            exit 1
          fi

          echo "branch_id=${BRANCH_ID}" >> "$GITHUB_OUTPUT"
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"
          # Mask the connection strings so they never appear in logs.
          echo "::add-mask::${DB_URL}"
          echo "::add-mask::${APP_DB_URL}"
          echo "migration_db_url=${DB_URL}" >> "$GITHUB_OUTPUT"
          echo "app_db_url=${APP_DB_URL}" >> "$GITHUB_OUTPUT"

      - name: Run DB migrations on preview branch
        env:
          DATABASE_URL: ${{ steps.neon.outputs.migration_db_url }}
        run: |
          set -euo pipefail
          # Apply all pending migrations to the freshly-forked Neon branch so
          # the preview Worker always starts with an up-to-date schema.
          # The Neon fork inherits the parent's data; idempotent — already-
          # applied migrations are skipped by the _athlya_migrations table.
          node packages/db/scripts/migrate.mjs
          echo "::notice::Preview branch migrations applied"

      - name: Generate per-PR wrangler config
        env:
          PR_N: ${{ github.event.pull_request.number }}
        run: |
          # Replace hardcoded `athlya-events-*-preview` queue names in
          # wrangler.toml with per-PR variants so concurrent PRs each have
          # their own isolated queue set (issue #419).
          # Longer/more-specific strings are replaced first to avoid
          # partial matches (e.g. -preview-dlq before -preview).
          node -e "
          const fs = require('fs');
          const pr = process.env.PR_N;
          const replacements = [
            ['athlya-events-notifications-preview-dlq', \`athlya-events-notifications-preview-pr-\${pr}-dlq\`],
            ['athlya-events-rgpd-preview-dlq',          \`athlya-events-rgpd-preview-pr-\${pr}-dlq\`],
            ['athlya-events-preview-dlq',               \`athlya-events-preview-pr-\${pr}-dlq\`],
            ['athlya-events-notifications-preview',     \`athlya-events-notifications-preview-pr-\${pr}\`],
            ['athlya-events-rgpd-preview',              \`athlya-events-rgpd-preview-pr-\${pr}\`],
            ['athlya-events-preview',                   \`athlya-events-preview-pr-\${pr}\`],
          ];
          let src = fs.readFileSync('packages/api/wrangler.toml', 'utf8');
          for (const [from, to] of replacements) src = src.replaceAll(from, to);
          fs.writeFileSync('packages/api/wrangler.preview-pr.toml', src);
          "

      - name: Set preview secrets
        env:
          PREVIEW_DB_URL: ${{ steps.neon.outputs.app_db_url }}
          PREVIEW_REDIS_URL: ${{ secrets.PREVIEW_REDIS_URL }}
          PREVIEW_REDIS_TOKEN: ${{ secrets.PREVIEW_REDIS_TOKEN }}
          PREVIEW_JWT_JWKS_URL: ${{ secrets.PREVIEW_JWT_JWKS_URL }}
          PREVIEW_JWT_KID: ${{ secrets.PREVIEW_JWT_KID }}
          PREVIEW_JWT_PRIVATE_KEY_PEM: ${{ secrets.PREVIEW_JWT_PRIVATE_KEY_PEM }}
          PREVIEW_JWT_PUBLIC_KEY_PEM: ${{ secrets.PREVIEW_JWT_PUBLIC_KEY_PEM }}
          PREVIEW_JWKS_JSON: ${{ secrets.PREVIEW_JWKS_JSON }}
          PREVIEW_TURNSTILE_SECRET: ${{ secrets.PREVIEW_TURNSTILE_SECRET }}
        run: |
          set -euo pipefail
          WRANGLER_NAME_FLAGS=(--env preview --name "${PREVIEW_WORKER_NAME}")

          printf '%s' "${PREVIEW_DB_URL}" | \
            pnpm --filter @athlya/api exec wrangler secret put DB_URL "${WRANGLER_NAME_FLAGS[@]}"

          # No browser app talks to a preview API; allow its own origin only
          # so the non-dev CORS guard does not reject every request.
          printf '%s' "${PREVIEW_URL}" | \
            pnpm --filter @athlya/api exec wrangler secret put CORS_ORIGIN "${WRANGLER_NAME_FLAGS[@]}"

          printf '%s' "${PREVIEW_REDIS_URL}" | \
            pnpm --filter @athlya/api exec wrangler secret put REDIS_URL "${WRANGLER_NAME_FLAGS[@]}"

          printf '%s' "${PREVIEW_REDIS_TOKEN}" | \
            pnpm --filter @athlya/api exec wrangler secret put REDIS_TOKEN "${WRANGLER_NAME_FLAGS[@]}"

          printf '%s' "${PREVIEW_JWT_JWKS_URL}" | \
            pnpm --filter @athlya/api exec wrangler secret put JWT_JWKS_URL "${WRANGLER_NAME_FLAGS[@]}"

          # JWT signing key material, as on staging (buildDefaultDeps
          # requires JWT_KID; buildAuthDeps loads the PEMs and JWKS).
          printf '%s' "${PREVIEW_JWT_KID}" | \
            pnpm --filter @athlya/api exec wrangler secret put JWT_KID "${WRANGLER_NAME_FLAGS[@]}"

          printf '%s' "${PREVIEW_JWT_PRIVATE_KEY_PEM}" | \
            pnpm --filter @athlya/api exec wrangler secret put JWT_PRIVATE_KEY_PEM "${WRANGLER_NAME_FLAGS[@]}"

          printf '%s' "${PREVIEW_JWT_PUBLIC_KEY_PEM}" | \
            pnpm --filter @athlya/api exec wrangler secret put JWT_PUBLIC_KEY_PEM "${WRANGLER_NAME_FLAGS[@]}"

          printf '%s' "${PREVIEW_JWKS_JSON}" | \
            pnpm --filter @athlya/api exec wrangler secret put JWKS_JSON "${WRANGLER_NAME_FLAGS[@]}"

          printf '%s' "${PREVIEW_TURNSTILE_SECRET}" | \
            pnpm --filter @athlya/api exec wrangler secret put TURNSTILE_SECRET "${WRANGLER_NAME_FLAGS[@]}"

      - name: Provision per-PR preview queues
        env:
          PR_N: ${{ github.event.pull_request.number }}
        run: |
          # Idempotent — `wrangler queues create` exits 0 if the queue already
          # exists, so re-runs on `synchronize` are safe (issues #237, #419).
          for Q in \
            "athlya-events-preview-pr-${PR_N}" \
            "athlya-events-preview-pr-${PR_N}-dlq" \
            "athlya-events-notifications-preview-pr-${PR_N}" \
            "athlya-events-notifications-preview-pr-${PR_N}-dlq" \
            "athlya-events-rgpd-preview-pr-${PR_N}" \
            "athlya-events-rgpd-preview-pr-${PR_N}-dlq"; do
            pnpm --filter @athlya/api exec wrangler queues create "$Q" || true
            echo "Queue $Q ready"
          done

      - name: Deploy Worker
        id: deploy
        env:
          PR_N: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          VERSION="pr${PR_N}-${GITHUB_SHA:0:7}"
          # `wrangler deploy` (not `versions upload`): the new version must
          # receive 100 % of the preview Worker's traffic (issue #419).
          pnpm --filter @athlya/api exec wrangler deploy \
            --config wrangler.preview-pr.toml \
            --env preview \
            --name "${PREVIEW_WORKER_NAME}" \
            --var "VERSION:${VERSION}" \
            --var "REDIS_KEY_PREFIX:pr-${PR_N}:"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"

      - name: Verify the preview serves this commit
        env:
          EXPECTED_VERSION: ${{ steps.deploy.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            SERVED=$(curl -sf --max-time 10 "${PREVIEW_URL}/health" | jq -r '.version // empty' || true)
            if [ "${SERVED}" = "${EXPECTED_VERSION}" ]; then
              echo "Preview serves ${SERVED} (attempt ${attempt})"
              exit 0
            fi
            echo "attempt ${attempt}: served '${SERVED:-none}', expected '${EXPECTED_VERSION}'"
            sleep 5
          done
          echo "::error::${PREVIEW_URL}/health never served ${EXPECTED_VERSION}"
          exit 1

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_N: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          NEON_BRANCH_NAME: ${{ steps.neon.outputs.branch_name }}
        run: |
          BODY="<!-- athlya-preview-env -->
          ## API Preview — PR #${PR_N}

          | | |
          |---|---|
          | **Endpoint** | \`${PREVIEW_URL}\` |
          | **Worker** | \`athlya-api-pr-${PR_N}\` |
          | **Neon branch** | \`${NEON_BRANCH_NAME}\` |
          | **Queues** | \`athlya-events-preview-pr-${PR_N}*\` |
          | **Version** | \`${{ steps.deploy.outputs.version }}\` (verified on \`/health\`) |

          > Per PR (issues #237, #419): its own Worker, Neon branch (\`athlya_app\` role) and queue set. **Shared across all previews:** the preview Redis database (keys prefixed \`pr-${PR_N}:\`) and the preview R2 buckets — do not store anything a concurrent PR must not see.
          > Neon branch, Worker, and queues are deleted automatically when this PR closes."

          # Update an existing preview comment rather than spamming new ones.
          COMMENT_ID=$(gh api \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_N}/comments" \
            --jq '.[] | select(.body | contains("<!-- athlya-preview-env -->")) | .id' | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
              -f body="${BODY}"
          else
            gh pr comment "${PR_N}" --body "${BODY}"
          fi

  # --------------------------------------------------------------------------
  # Teardown: runs when a PR is closed (merged or abandoned)
  # --------------------------------------------------------------------------
  teardown:
    if: github.event.action == 'closed' && vars.NEON_PROJECT_ID != ''
    name: Teardown preview (PR #${{ github.event.pull_request.number }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_WORKER_NAME: athlya-api-pr-${{ github.event.pull_request.number }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete preview Worker
        continue-on-error: true
        run: |
          pnpm --filter @athlya/api exec wrangler delete \
            --name "${PREVIEW_WORKER_NAME}" \
            --force
          echo "Deleted Worker ${PREVIEW_WORKER_NAME} (or already absent)"

      - name: Delete per-PR preview queues
        continue-on-error: true
        env:
          PR_N: ${{ github.event.pull_request.number }}
        run: |
          # Delete in reverse dependency order (DLQs last so consumers can drain).
          # `continue-on-error: true` keeps teardown going if a queue was never
          # provisioned (e.g. the deploy step failed before queue creation).
          for Q in \
            "athlya-events-notifications-preview-pr-${PR_N}" \
            "athlya-events-rgpd-preview-pr-${PR_N}" \
            "athlya-events-preview-pr-${PR_N}" \
            "athlya-events-notifications-preview-pr-${PR_N}-dlq" \
            "athlya-events-rgpd-preview-pr-${PR_N}-dlq" \
            "athlya-events-preview-pr-${PR_N}-dlq"; do
            pnpm --filter @athlya/api exec wrangler queues delete "$Q" && \
              echo "Deleted queue $Q" || \
              echo "Queue $Q not found — skipping"
          done

      - name: Delete Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PR_N: ${{ github.event.pull_request.number }}
        run: |
          BRANCH_NAME="preview-pr-${PR_N}"

          BRANCH_ID=$(curl -sf \
            "${NEON_API}/projects/${{ vars.NEON_PROJECT_ID }}/branches" \
            -H "Authorization: Bearer ${NEON_API_KEY}" | \
            jq -r ".branches[] | select(.name == \"${BRANCH_NAME}\") | .id")

          if [ -z "$BRANCH_ID" ] || [ "$BRANCH_ID" = "null" ]; then
            echo "Branch ${BRANCH_NAME} not found — skipping teardown."
            exit 0
          fi

          curl -sf -X DELETE \
            "${NEON_API}/projects/${{ vars.NEON_PROJECT_ID }}/branches/${BRANCH_ID}" \
            -H "Authorization: Bearer ${NEON_API_KEY}"

          echo "Deleted Neon branch ${BRANCH_NAME} (${BRANCH_ID})"

      - name: Flush preview Redis keys (pr-{N}:*)
        continue-on-error: true
        env:
          PREVIEW_REDIS_URL: ${{ secrets.PREVIEW_REDIS_URL }}
          PREVIEW_REDIS_TOKEN: ${{ secrets.PREVIEW_REDIS_TOKEN }}
          PR_N: ${{ github.event.pull_request.number }}
        run: |
          PREFIX="pr-${PR_N}:"

          if [ -z "${PREVIEW_REDIS_URL}" ] || [ -z "${PREVIEW_REDIS_TOKEN}" ]; then
            echo "PREVIEW_REDIS_URL/TOKEN not set — skipping Redis flush"
            exit 0
          fi

          # SCAN for all keys matching the PR prefix, then DEL them in
          # batches. Uses the Upstash REST API directly (no wrangler needed).
          # The loop terminates when cursor returns to "0".
          CURSOR=0
          DELETED=0
          while true; do
            RESULT=$(curl -sf "${PREVIEW_REDIS_URL}/scan/${CURSOR}?match=${PREFIX}*&count=200" \
              -H "Authorization: Bearer ${PREVIEW_REDIS_TOKEN}")
            CURSOR=$(echo "${RESULT}" | jq -r '.[0]')
            KEYS=$(echo "${RESULT}" | jq -r '.[1][]' | tr '\n' ' ')
            if [ -n "${KEYS}" ]; then
              KEY_ARGS=$(echo "${KEYS}" | sed 's/ $//' | xargs -I{} echo '"{}"' | tr '\n' ',' | sed 's/,$//')
              curl -sf -X POST "${PREVIEW_REDIS_URL}/del" \
                -H "Authorization: Bearer ${PREVIEW_REDIS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "[${KEY_ARGS}]" > /dev/null
              COUNT=$(echo "${KEYS}" | wc -w | tr -d ' ')
              DELETED=$((DELETED + COUNT))
            fi
            if [ "${CURSOR}" = "0" ]; then break; fi
          done
          echo "Flushed ${DELETED} Redis keys with prefix '${PREFIX}'"
