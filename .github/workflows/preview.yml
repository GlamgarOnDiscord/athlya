name: Preview environments

# Deploys an isolated API preview for every PR:
#   • Neon branch  — fresh DB fork from the project primary branch.
#   • Cloudflare Worker — `athlya-api-pr-<N>` (one Worker per PR, isolated DB_URL).
#   • Queues — dedicated `athlya-events-preview*` set, provisioned here and
#     deleted on PR close so preview events never contaminate staging (issue #237).
#   • Redis — dedicated Upstash `athlya-preview` database (PREVIEW_REDIS_URL /
#     PREVIEW_REDIS_TOKEN secrets), isolated from the staging namespace (issue #237).
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN      — Workers:Edit permission
#   CLOUDFLARE_ACCOUNT_ID     — CF account ID
#   NEON_API_KEY              — Neon project API key
#   PREVIEW_REDIS_URL         — Upstash Redis URL (dedicated preview database)
#   PREVIEW_REDIS_TOKEN       — Upstash Redis token (dedicated preview database)
#   PREVIEW_JWT_JWKS_URL      — JWKS endpoint for preview (can reuse staging)
#   PREVIEW_TURNSTILE_SECRET  — Turnstile secret (staging site key is fine)
#
# Required GitHub variables:
#   NEON_PROJECT_ID           — Neon project ID (e.g. "proud-dream-12345678")
#   CLOUDFLARE_WORKERS_SUBDOMAIN — CF workers.dev subdomain (e.g. "athlya")
#
# See docs/runbooks/preview-pr.md for full setup instructions.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  # One preview deploy at a time per PR; updates to the same PR cancel the
  # in-flight deploy so only the latest commit is served.
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Deploy: runs on every push to an open PR
  # --------------------------------------------------------------------------
  deploy:
    if: github.event.action != 'closed' && vars.NEON_PROJECT_ID != ''
    name: Deploy preview (PR #${{ github.event.pull_request.number }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_WORKER_NAME: athlya-api-pr-${{ github.event.pull_request.number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Neon branch
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          BRANCH_NAME="preview-pr-${{ github.event.pull_request.number }}"

          # Idempotent: if a branch already exists for this PR (e.g. on
          # `synchronize`), Neon returns 409. We detect that and fetch the
          # existing branch instead of failing.
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.neon.tech/v1/projects/${{ vars.NEON_PROJECT_ID }}/branches" \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"branch\": {\"name\": \"${BRANCH_NAME}\"}}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" = "409" ]; then
            # Branch exists — fetch its connection URI.
            BRANCH_ID=$(curl -sf \
              "https://api.neon.tech/v1/projects/${{ vars.NEON_PROJECT_ID }}/branches" \
              -H "Authorization: Bearer ${NEON_API_KEY}" | \
              jq -r ".branches[] | select(.name == \"${BRANCH_NAME}\") | .id")

            BODY=$(curl -sf \
              "https://api.neon.tech/v1/projects/${{ vars.NEON_PROJECT_ID }}/branches/${BRANCH_ID}" \
              -H "Authorization: Bearer ${NEON_API_KEY}")
          fi

          BRANCH_ID=$(echo "$BODY" | jq -r '.branch.id // .id')
          DB_URL=$(echo "$BODY" | jq -r '.connection_uris[0].connection_uri // empty')

          if [ -z "$DB_URL" ]; then
            echo "::error::Failed to obtain DB_URL from Neon API (response omitted to avoid leaking credentials)"
            exit 1
          fi

          echo "branch_id=${BRANCH_ID}" >> "$GITHUB_OUTPUT"
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"
          # Mask the connection string so it never appears in logs.
          echo "::add-mask::${DB_URL}"
          echo "db_url=${DB_URL}" >> "$GITHUB_OUTPUT"

      - name: Set preview secrets
        run: |
          VERSION="pr${{ github.event.pull_request.number }}-${GITHUB_SHA:0:7}"
          WRANGLER_NAME_FLAGS=(--env preview --name "${PREVIEW_WORKER_NAME}")

          printf '%s' "${{ steps.neon.outputs.db_url }}" | \
            pnpm --filter @athlya/api exec wrangler secret put DB_URL "${WRANGLER_NAME_FLAGS[@]}"

          printf '%s' "${{ secrets.PREVIEW_REDIS_URL }}" | \
            pnpm --filter @athlya/api exec wrangler secret put REDIS_URL "${WRANGLER_NAME_FLAGS[@]}"

          printf '%s' "${{ secrets.PREVIEW_REDIS_TOKEN }}" | \
            pnpm --filter @athlya/api exec wrangler secret put REDIS_TOKEN "${WRANGLER_NAME_FLAGS[@]}"

          printf '%s' "${{ secrets.PREVIEW_JWT_JWKS_URL }}" | \
            pnpm --filter @athlya/api exec wrangler secret put JWT_JWKS_URL "${WRANGLER_NAME_FLAGS[@]}"

          printf '%s' "${{ secrets.PREVIEW_TURNSTILE_SECRET }}" | \
            pnpm --filter @athlya/api exec wrangler secret put TURNSTILE_SECRET "${WRANGLER_NAME_FLAGS[@]}"

      - name: Provision preview queues
        run: |
          # Idempotent — `wrangler queues create` exits 0 if the queue already
          # exists, so re-runs on `synchronize` are safe (issue #237).
          for Q in \
            athlya-events-preview \
            athlya-events-preview-dlq \
            athlya-events-notifications-preview \
            athlya-events-notifications-preview-dlq \
            athlya-events-rgpd-preview \
            athlya-events-rgpd-preview-dlq; do
            pnpm --filter @athlya/api exec wrangler queues create "$Q" || true
            echo "Queue $Q ready"
          done

      - name: Deploy Worker
        id: deploy
        run: |
          VERSION="pr${{ github.event.pull_request.number }}-${GITHUB_SHA:0:7}"
          DEPLOY_OUT=$(pnpm --filter @athlya/api exec wrangler versions upload \
            --env preview \
            --name "${PREVIEW_WORKER_NAME}" \
            --var "VERSION=${VERSION}" \
            --message "PR #${{ github.event.pull_request.number }} — ${GITHUB_SHA:0:7}" \
            2>&1)
          echo "$DEPLOY_OUT"

          # Deterministic per-PR workers.dev URL (no shared DB_URL secret race).
          PREVIEW_URL="https://${PREVIEW_WORKER_NAME}.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev"
          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="<!-- athlya-preview-env -->
          ## API Preview — PR #${{ github.event.pull_request.number }}

          | | |
          |---|---|
          | **Endpoint** | \`${{ steps.deploy.outputs.preview_url }}\` |
          | **Worker** | \`athlya-api-pr-${{ github.event.pull_request.number }}\` |
          | **Neon branch** | \`${{ steps.neon.outputs.branch_name }}\` |
          | **Commit** | \`${GITHUB_SHA:0:7}\` |

          > One Worker + Neon branch per PR. Queues and Redis are isolated from staging (issue #237). R2 uses dedicated preview buckets.
          > The Neon branch and preview queues are deleted automatically when this PR closes."

          # Update an existing preview comment rather than spamming new ones.
          COMMENT_ID=$(gh api \
            "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.body | contains("<!-- athlya-preview-env -->")) | .id' | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH \
              "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              -f body="${BODY}"
          else
            gh pr comment ${{ github.event.pull_request.number }} --body "${BODY}"
          fi

  # --------------------------------------------------------------------------
  # Teardown: runs when a PR is closed (merged or abandoned)
  # --------------------------------------------------------------------------
  teardown:
    if: github.event.action == 'closed' && vars.NEON_PROJECT_ID != ''
    name: Teardown preview (PR #${{ github.event.pull_request.number }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_WORKER_NAME: athlya-api-pr-${{ github.event.pull_request.number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete preview Worker
        continue-on-error: true
        run: |
          pnpm --filter @athlya/api exec wrangler delete \
            --name "${PREVIEW_WORKER_NAME}" \
            --force
          echo "Deleted Worker ${PREVIEW_WORKER_NAME} (or already absent)"

      - name: Delete preview queues
        continue-on-error: true
        run: |
          # Delete in reverse dependency order (DLQs last so consumers can drain).
          # `continue-on-error: true` keeps teardown going if a queue was never
          # provisioned (e.g. the deploy step failed before queue creation).
          for Q in \
            athlya-events-notifications-preview \
            athlya-events-rgpd-preview \
            athlya-events-preview \
            athlya-events-notifications-preview-dlq \
            athlya-events-rgpd-preview-dlq \
            athlya-events-preview-dlq; do
            pnpm --filter @athlya/api exec wrangler queues delete "$Q" && \
              echo "Deleted queue $Q" || \
              echo "Queue $Q not found — skipping"
          done

      - name: Delete Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          BRANCH_NAME="preview-pr-${{ github.event.pull_request.number }}"

          BRANCH_ID=$(curl -sf \
            "https://api.neon.tech/v1/projects/${{ vars.NEON_PROJECT_ID }}/branches" \
            -H "Authorization: Bearer ${NEON_API_KEY}" | \
            jq -r ".branches[] | select(.name == \"${BRANCH_NAME}\") | .id")

          if [ -z "$BRANCH_ID" ] || [ "$BRANCH_ID" = "null" ]; then
            echo "Branch ${BRANCH_NAME} not found — skipping teardown."
            exit 0
          fi

          curl -sf -X DELETE \
            "https://api.neon.tech/v1/projects/${{ vars.NEON_PROJECT_ID }}/branches/${BRANCH_ID}" \
            -H "Authorization: Bearer ${NEON_API_KEY}"

          echo "Deleted Neon branch ${BRANCH_NAME} (${BRANCH_ID})"
