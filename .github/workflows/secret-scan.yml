name: Secret scan (gitleaks)

# Sprint 14 / Slice 14.3 (Epic CN.3.2) — détection de secrets
# committed accidentellement.
#
# gitleaks scanne :
#   - Patterns de clefs AWS, GCP, Stripe, GitHub tokens, JWT signed
#   - Patterns custom dans `.gitleaks.toml` (non requis ici par
#     défaut — la config built-in couvre les ~150 patterns
#     standard)
#
# Cycles :
#   - PR scan : analyse les commits ajoutés par la PR (rapide)
#   - Schedule weekly : full repo + history scan
#
# Findings remontent en GitHub annotation + GitHub Security tab.
# Une seule détection HIGH-confidence fail le build.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly scan complet — utile pour détecter un secret
    # historique qu'on n'aurait pas vu sur une PR récente.
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    name: Run gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history requis pour scanner les commits passés.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `GITLEAKS_LICENSE` requis seulement pour les private
          # repos en plan free (cf docs gitleaks). Si on est en
          # public ou Enterprise, on peut commenter.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
