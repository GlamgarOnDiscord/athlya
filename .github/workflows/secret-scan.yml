name: Secret scan (gitleaks)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    name: Run gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (with SHA256 verification)
        env:
          GITLEAKS_VERSION: '8.18.4'
          GITLEAKS_SHA256: 'ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d'
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C /usr/local/bin gitleaks < /tmp/gitleaks.tar.gz
          gitleaks version

      - name: Scan (pull request — commits in PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts "${BASE_SHA}..${HEAD_SHA}" \
            --verbose

      - name: Scan (push — newly pushed commits)
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts "${BEFORE_SHA}..${AFTER_SHA}" \
            --verbose

      - name: Scan (schedule — full history)
        if: github.event_name == 'schedule'
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --verbose
