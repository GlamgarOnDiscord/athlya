name: Secret scan (gitleaks)

# Sprint 14 / Slice 14.3 (Epic CN.3.2) — détection de secrets
# committed accidentellement.
#
# gitleaks scanne :
#   - Patterns de clefs AWS, GCP, Stripe, GitHub tokens, JWT signed
#   - Patterns custom dans `.gitleaks.toml`
#
# Cycles :
#   - PR scan : analyse les commits ajoutés par la PR (rapide)
#   - Push master : analyse les commits poussés
#   - Schedule weekly : full repo + history scan
#
# Note : gitleaks-action@v2 exige une licence commerciale pour les
# repos privés. On installe directement le binaire OSS (MIT) pour
# s'affranchir de cette contrainte.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly scan complet — utile pour détecter un secret
    # historique qu'on n'aurait pas vu sur une PR récente.
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    name: Run gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history requis pour scanner les commits passés.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan (pull request — commits in PR only)
        if: github.event_name == 'pull_request'
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --verbose

      - name: Scan (push — newly pushed commits)
        if: github.event_name == 'push'
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts "${{ github.event.before }}..${{ github.event.after }}" \
            --verbose

      - name: Scan (schedule — full history)
        if: github.event_name == 'schedule'
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --verbose
